[project]
name = "figure-agent-svg"
version = "0.1.0"
description = "Claude Code plugin experiment: SVG-first paper-figure production with locked vtracer underlay evidence, semantic SVG source, export, QA, and freshness checks."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
py-modules = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.5",
]
