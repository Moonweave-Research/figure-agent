      - {series: Power-law, x: 2, y: 78}
      - {series: Power-law, x: 5, y: 38}
      - {series: Power-law, x: 10, y: 21}
      - {series: Power-law, x: 20, y: 12}
      - {series: Power-law, x: 50, y: 5.6}
      - {series: Power-law, x: 100, y: 3.1}
      - {series: Debye reference, x: 1, y: 100}
      - {series: Debye reference, x: 2, y: 88}
      - {series: Debye reference, x: 5, y: 62}
      - {series: Debye reference, x: 10, y: 35}
