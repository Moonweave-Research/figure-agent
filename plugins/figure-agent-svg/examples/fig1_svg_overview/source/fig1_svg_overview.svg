      <circle data-object-id="semantic-node-b" data-bbox="1005 344 70 70"
        cx="1040" cy="379" r="35" fill="#F97316" stroke="#111827" stroke-width="1.2"/>
      <path data-object-id="semantic-connection" data-bbox="880 304 130 64"
        data-overlap="allow"
        d="M880 318 C930 338 962 356 1010 368"
        fill="none" stroke="#2563EB" stroke-width="1.8"/>
      <rect data-object-id="semantic-label-band" data-bbox="758 448 310 48"
        x="758" y="448" width="310" height="48" rx="6"
        fill="#E5E7EB" stroke="#6B7280" stroke-width="0.8"/>

      <rect data-object-id="export-stack" data-bbox="1302 188 194 300"
        data-overlap="allow"
        x="1302" y="188" width="194" height="300" rx="10"
        fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
      <rect data-object-id="export-pdf" data-bbox="1340 232 118 52"
        x="1340" y="232" width="118" height="52" rx="6"
        fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
      <rect data-object-id="export-png" data-bbox="1340 310 118 52"
        x="1340" y="310" width="118" height="52" rx="6"
        fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
      <rect data-object-id="export-tif" data-bbox="1340 388 118 52"
        x="1340" y="388" width="118" height="52" rx="6"
        fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
      <rect data-object-id="qa-checklist" data-bbox="1532 188 194 300"
        data-overlap="allow"
        x="1532" y="188" width="194" height="300" rx="10"
        fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
      <path data-object-id="qa-checkmarks" data-bbox="1572 262 94 126"
