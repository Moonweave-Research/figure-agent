<svg xmlns="http://www.w3.org/2000/svg"
  data-figure-agent-svg="semantic-v1"
  data-journal-preset="nature-double"
  width="183mm" height="82mm" viewBox="0 0 1830 820">
  <g id="semantic-layer">
    <g id="panels">
      <g id="panel-a" data-role="panel" data-bbox="60 96 520 604">
        <rect x="60" y="96" width="520" height="604" rx="16"
          fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
      </g>
      <g id="panel-b" data-role="panel" data-bbox="655 96 520 604">
        <rect x="655" y="96" width="520" height="604" rx="16"
          fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
      </g>
      <g id="panel-c" data-role="panel" data-bbox="1250 96 520 604">
        <rect x="1250" y="96" width="520" height="604" rx="16"
          fill="#FFFFFF" stroke="#6B7280" stroke-width="1.2"/>
      </g>
    </g>

    <g id="objects">
      <rect data-object-id="reference-card" data-bbox="110 188 420 136"
        data-overlap="allow"
        x="110" y="188" width="420" height="136" rx="10"
        fill="#E5E7EB" stroke="#111827" stroke-width="1.2"/>
      <path data-object-id="reference-waveform" data-bbox="156 238 304 48"
        d="M156 264 C196 222 238 222 278 264 C318 306 360 306 400 264 C426 236 442 236 460 264"
        fill="none" stroke="#2563EB" stroke-width="1.8"/>
      <rect data-object-id="locked-underlay-card" data-bbox="110 422 420 136"
        data-overlap="allow"
        x="110" y="422" width="420" height="136" rx="10"
        fill="#E5E7EB" stroke="#111827" stroke-width="1.2"/>
      <path data-object-id="underlay-trace-lines" data-bbox="154 462 308 64"
        d="M154 510 L230 462 L314 516 L390 468 L462 506"
        fill="none" stroke="#7C3AED" stroke-width="1.2"/>
      <path data-object-id="evidence-arrow" data-bbox="282 338 76 58"
        data-overlap="allow"
        d="M320 338 L320 382 M298 360 L320 382 L342 360"
        fill="none" stroke="#111827" stroke-width="1.8"/>

      <rect data-object-id="semantic-source-card" data-bbox="705 188 420 370"
        data-overlap="allow"
        x="705" y="188" width="420" height="370" rx="10"
        fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
      <rect data-object-id="semantic-panel-block" data-bbox="758 246 140 104"
        x="758" y="246" width="140" height="104" rx="8"
        fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
      <circle data-object-id="semantic-node-a" data-bbox="940 236 70 70"
