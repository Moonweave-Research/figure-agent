      <path data-object-id="export-to-qa-arrow" data-bbox="1494 320 38 36"
        data-overlap="allow"
        d="M1494 338 L1524 338 M1510 324 L1524 338 L1510 352"
        fill="none" stroke="#111827" stroke-width="1.8"/>
    </g>

    <g id="labels">
      <text data-text-role="title" data-bbox="60 42 480 24" x="60" y="62"
        font-family="Arial" font-size="18" fill="#111827">Fig. 1 SVG-first paper figure workflow</text>

      <text data-text-role="panel_letter" data-bbox="88 118 18 20" x="88" y="136"
        font-family="Arial" font-size="16" fill="#111827">A</text>
      <text data-text-role="panel_letter" data-bbox="683 118 18 20" x="683" y="136"
        font-family="Arial" font-size="16" fill="#111827">B</text>
      <text data-text-role="panel_letter" data-bbox="1278 118 18 20" x="1278" y="136"
        font-family="Arial" font-size="16" fill="#111827">C</text>

      <text data-text-role="label" data-bbox="132 162 164 18" x="132" y="176"
        font-family="Arial" font-size="14" fill="#111827">Reference or draft</text>
      <text data-text-role="label" data-bbox="132 396 194 18" x="132" y="410"
        font-family="Arial" font-size="14" fill="#111827">Locked vtracer underlay</text>
      <text data-text-role="micro" data-bbox="132 586 300 16" x="132" y="598"
        font-family="Arial" font-size="11" fill="#6B7280">coordinate evidence, removed before export</text>

      <text data-text-role="label" data-bbox="730 162 162 18" x="730" y="176"
        font-family="Arial" font-size="14" fill="#111827">Semantic SVG source</text>
      <text data-text-role="micro" data-bbox="778 474 252 16" x="778" y="486"
        font-family="Arial" font-size="11" fill="#6B7280">editable groups, labels, objects, bboxes</text>
      <text data-text-role="micro" data-bbox="760 604 300 16" x="760" y="616"
        font-family="Arial" font-size="11" fill="#6B7280">TikZ may generate fragments, not final source</text>

      <text data-text-role="label" data-bbox="1322 162 132 18" x="1322" y="176"
        font-family="Arial" font-size="14" fill="#111827">Manuscript export</text>
      <text data-text-role="micro" data-bbox="1374 264 48 16" x="1374" y="276"
        font-family="Arial" font-size="11" fill="#111827">PDF</text>
      <text data-text-role="micro" data-bbox="1374 342 48 16" x="1374" y="354"
        font-family="Arial" font-size="11" fill="#111827">PNG</text>
      <text data-text-role="micro" data-bbox="1374 420 48 16" x="1374" y="432"
        font-family="Arial" font-size="11" fill="#111827">TIFF</text>
      <text data-text-role="label" data-bbox="1552 162 58 18" x="1552" y="176"
        font-family="Arial" font-size="14" fill="#111827">QA gate</text>
      <text data-text-role="micro" data-bbox="1560 532 172 16" x="1560" y="544"
        font-family="Arial" font-size="11" fill="#6B7280">labels, objects, overlap</text>
      <text data-text-role="micro" data-bbox="1560 558 174 16" x="1560" y="570"
        font-family="Arial" font-size="11" fill="#6B7280">margin, freshness, diff</text>
    </g>
  </g>
</svg>
