name: fig2_charge_transport_mechanism
paper_binding:
  paper_id: pair001
  figure_id: fig2
  role_id: charge_transport_mechanism_schematic
title: "Fig. 2a — Charge-transport mechanism schematic"
style_profile: polymer-paper
undeclared_geometry_profile: schematic
visual_clash_cap: 8

final_size_contract:
  basis: width_limited_nature_family_main_figure
  natural_size_mm: [163.8, 46.42]
  target_width_mm: 163.8
  max_height_mm: 170.0
  min_print_font_pt: 5.0
  scale_basis: width_limited
  double_column_reference_mm:
    nature_communications: 180.0
    nature_figure_guide: 183.0
  note: Panel a is a full-width schematic row; panels b–d remain evidence-bound quantitative data products.

semantic_contract_required: true

# These anchors protect the intended left-to-right reading order without
# turning the schematic into a coordinate recipe for future authoring.
semantic_assertions:
  - id: measurement-precedes-conventional
    relation: left_of
    subject: Measurement
    reference: Conventional
    tolerance_pt: 12.0
  - id: conventional-precedes-sulfur
    relation: left_of
    subject: Conventional
    reference: Sulfur-rich
    tolerance_pt: 12.0
  - id: sulfur-precedes-readout
    relation: left_of
    subject: Sulfur-rich
    reference: What
    tolerance_pt: 12.0

panels:
  - id: A
    caption: Measurement context, conventional-versus-sulfur charge retention schematic, and the two transient-current windows read in panels b–d
    bbox_pdf_cm: [0.00, 0.00, 16.38, 4.75]

text_boundary_checks:
  - id: mechanism-strip-top-band
    kind: rect
    role: header_band
    mode: contain_text
    bbox_pdf_cm: [0.00, 0.00, 16.38, 1.20]
    clearance_pt: 0.0
    text_allowlist: [Measurement, Conventional, Sulfur-rich, What]

label_path_proximity_checks:
  - id: measurement-field-label
    kind: vertical_line
    role: field_direction
    x_pdf_cm: 3.0
    y_range_pdf_cm: [1.85, 3.70]
    clearance_pt: 2.5
    text_phrases:
      - id: field-label
        words: [MV]
  - id: readout-window-divider
    kind: vertical_line
    role: fit-window-divider
    x_pdf_cm: 14.05
    y_range_pdf_cm: [1.77, 3.61]
    clearance_pt: 2.5
    text_phrases:
      - id: late-window
        words: ["30–300"]

notes: |
  This fixture is intentionally schematic-only. The canonical Fig. 2 data
  panels b–d are generated by the charge-transport data pipeline from the
  declared CSV inputs in the Surfur_Polymer figure-set workspace. This panel
  names the working interpretation and makes the two fit windows visible; it
  must not be read as a measured transient or a quantitative trap-distribution
  diagram.
