name: fig2_charge_transport_mechanism
paper_binding:
  paper_id: pair001
  figure_id: fig2
  role_id: charge_transport_mechanism_schematic
title: "Fig. 2a — Charge-transport mechanism schematic"
style_profile: polymer-paper
undeclared_geometry_profile: schematic
visual_clash_cap: 8
# Two adjacent text lines that overlap by a thin band never reach the word-pair
# IoU threshold. This strip lost a full header row to that blind spot, so it
# gates on the band-overlap finding as well.
text_line_overlap_gate: strict
review_scale_previews: required
paper_aesthetic_context: nc-main-text-series
aesthetic_intent: aesthetic_intent.yaml

final_size_contract:
  basis: width_limited_nature_family_main_figure
  natural_size_mm: [180.0, 51.02]
  target_width_mm: 180.0
  max_height_mm: 170.0
  min_print_font_pt: 5.0
  scale_basis: width_limited
  double_column_reference_mm:
    nature_communications: 180.0
    nature_figure_guide: 183.0
  note: Panel a is a full-width schematic row; panels b–d remain evidence-bound quantitative data products.

# The parent 4-panel composition owns the page-level a--d markers and provides
# a 180.0 × 53.19 mm row. This fixture is the content-only artboard placed
# flush left and vertically centered in that row; the remaining vertical space
# is an intentional integration gutter, not unallocated source content.
panel_integration:
  host_layout: fig2_charge_transport_4panel
  host_figure_size_mm: [183.0, 126.0]
  slot_size_mm: [180.0, 53.19]
  placement: {horizontal: center, vertical: center}
  panel_letter_owner: host_data_pipeline
  panel_content_size_mm: [180.0, 51.02]
  note: Keep a–d navigation labels in one owner; do not paste a second panel letter into this artboard.

semantic_contract_required: true

tex_assertions:
  - id: comparison-reaches-readout
    source_name: fig2_charge_transport_mechanism.tex
    anchor_style: storyArrow
    axis: x
    direction: increasing
    minimum_matches: 1
    require_unidirectional_arrow: true

named_endpoint_assertions:
  - id: comparison-arrow-binds-to-readout-boundary
    source_name: fig2_charge_transport_mechanism.tex
    anchor_style: storyArrow
    minimum_paths: 1
    required_anchors: [comparison_out, readout_entry]
    allowed_anchors: [comparison_out, readout_entry, early_state_out, progress_state_in, progress_state_out, late_state_in]

# These anchors check reader-role hierarchy without forcing a particular
# bracket, separator, or other comparison primitive.
# The localized-state marks are a qualitative collection, never an energy or
# density axis. Constant bar length plus irregular lateral positions are what
# keep the field from reading as a fitted DOS silhouette, and the assertion
# below makes that a property the source cannot lose silently.
state_field_geometry_assertions:
  - id: localized-state-field-is-not-a-density-envelope
    source_object: sulfur_working_state
    kind: horizontal_state_field
    min_marks: 6
    min_vertical_span_cm: 0.60
    min_center_std_cm: 0.15
    max_width_abs_midpoint_correlation: -0.30

semantic_assertions:
  - id: reference-left-of-sulfur
    relation: left_of
    subject: idealized
    reference: sulfur-rich
    tolerance_pt: 12.0
  - id: comparison-precedes-readout
    relation: left_of
    subject: long-lived
    reference: qualitative
    tolerance_pt: 12.0

panels:
  - id: A
    caption: Field-on measurement context, idealized reference, progressive trapping in one sulfur-rich MIM, and a persistent-relaxation transient readout
    bbox_pdf_cm: [0.00, 0.00, 18.00, 5.10]

composition_model:
  panels:
    A:
      objects:
        comparison_frame:
          kind: annotation
          truth_bearing: false
          role: panel_caption
          semantic_claim: shared field-on condition for matched lateral material cells
          allowed_creative_ops: [adjust_header_spacing, reframe_shared_condition]
        reference_dielectric:
          kind: material_state
          truth_bearing: true
          semantic_claim: idealized dielectric is a conceptual bound-polarization reference
          invariant: reference_remains_lateral_and_is_not_an_actual_material_control
          allowed_creative_ops: [resize_lateral_cell, redraw_bound_dipoles]
        sulfur_working_state:
          kind: material_state
          truth_bearing: true
          semantic_claim: one sulfur-rich specimen is shown through progressive trapping states as a qualified working model
          invariant: sulfur_sequence_reuses_mim_geometry_and_avoids_complete_blockage_or_quantitative_occupancy_claims
          allowed_creative_ops: [resize_sequence_lane, redraw_amorphous_host, redraw_state_cues]
        qualitative_current_readout:
          kind: mini_plot
          truth_bearing: true
          anchor_target: sulfur_working_state
          semantic_claim: compact qualitative log--log output shows persistent relaxation after early power-law decay
          invariant: readout_remains_secondary_schematic_not_measured_and_leaves_cross_material_normalization_to_data_panels
          allowed_creative_ops: [resize_readout_lane, reshape_qualitative_curve, consolidate_annotation]

text_boundary_checks:
  - id: mechanism-strip-top-band
    kind: rect
    role: header_band
    mode: contain_text
    bbox_pdf_cm: [0.00, 0.00, 17.71, 5.42]
    clearance_pt: 0.0
    text_allowlist: [idealized, sulfur-rich, qualitative, bound, early, progressive, long-lived, persistent, occupied, empty]

# The three held-field states must stay individually visible and ordered; the
# sequence, not any single cell, is what carries the mechanism.
process_stage_visibility_checks:
  - id: sulfur-held-field-sequence-visible
    panel_id: A
    reading_axis: x
    minimum_stage_separation_pt: 40.0
    stages:
      - id: early_field_on
        text_phrases:
          - id: early-field-on
            words: ["early", "field-on"]
      - id: progressive_trapping
        text_phrases:
          - id: progressive-trapping
            words: ["progressive", "trapping"]
      - id: long_lived_occupied
        text_phrases:
          - id: long-lived-occupied-state
            words: ["long-lived", "occupied", "state"]

# Both readout annotations are guarded against the curve they name, so a later
# edit cannot let a label settle onto its own trace.
label_path_proximity_checks:
  - id: persistent-relaxation-clears-late-trace
    kind: vertical_line
    role: late-departure-trace
    x_pdf_cm: 16.714
    y_range_pdf_cm: [2.637, 2.747]
    clearance_pt: 2.5
    text_phrases:
      - id: persistent-relaxation
        words: ["persistent", "relaxation"]
  - id: early-power-law-clears-early-segment
    kind: vertical_line
    role: early-power-law-trace
    x_pdf_cm: 14.945
    y_range_pdf_cm: [2.099, 2.209]
    clearance_pt: 2.5
    text_phrases:
      - id: early-power-law
        words: ["early", "power", "law"]

# Declared vector-to-vector clearance relations, measured against the authored
# TikZ coordinates. The detector reads literal coordinates only, so the
# macro-driven MIM cells and their \foreach-generated contents are invisible to
# it; these four relations are the ones written as literal endpoints.
vector_clearance_checks:
  # The two source leads break around the V ring (radius 0.30 cm). The break
  # must stay at least as wide as the glyph or a lead runs through the ring.
  - id: source-lead-break-clears-voltage-source-ring
    element_a:
      source_line: 126
      matched_text: '\draw[sourceWire] (0.34,3.50)--(0.34,2.925)'
      kind: line
    element_b:
      source_line: 127
      matched_text: '\draw[sourceWire] (0.34,2.325)--(0.34,1.75)'
      kind: line
    min_clearance_cm: 0.55
  # The dashed early fit is the measured early segment extended forward. A gap
  # at the handover would turn the extrapolation into a second, unrelated trace.
  - id: early-fit-continues-measured-early-trace
    element_a:
      source_line: 253
      matched_text: '\draw[traceEarly] (13.02,3.40)--(14.12,2.75)'
      kind: line
    element_b:
      source_line: 254
      matched_text: '\draw[fitReference] (14.12,2.75)--(15.20,2.112)'
      kind: line
    must_touch: true
  # The late departure branches from the end of the early segment: a transient
  # bends away from its own fit, it does not restart at a detached point.
  - id: late-trace-branches-from-early-trace-endpoint
    element_a:
      source_line: 258
      matched_text: '\draw[traceLate] (14.12,2.75) .. controls (14.35,2.61) and (15.30,2.56) ..'
      kind: curve
    element_b:
      source_line: 253
      matched_text: '\draw[traceEarly] (13.02,3.40)--(14.12,2.75)'
      kind: line
    must_touch: true
  # The two marker-key swatches bracket the "empty state" caption lane; closing
  # that lane merges the key into one entry at print reduction.
  - id: marker-key-swatches-keep-caption-lane
    element_a:
      source_line: 218
      matched_text: '\draw[trapState] (6.04,1.34)--(6.38,1.34)'
      kind: line
    element_b:
      source_line: 220
      matched_text: '\draw[trapStateFull] (8.12,1.34)--(8.46,1.34)'
      kind: line
    min_clearance_cm: 1.40

notes: |
  This fixture is intentionally schematic-only. The canonical Fig. 2 data
  panels b–d are generated by the charge-transport data pipeline from the
  declared CSV inputs in the Surfur_Polymer figure-set workspace. This panel
  names a qualified progressive-trapping interpretation and uses only standard
  log--log early-power-law-to-persistent-relaxation grammar; it must not be read
  as a measured transient, an absolute-current comparison, a complete current
  blockage, a normalized-deviation metric, or a quantitative trap-distribution
  diagram.
