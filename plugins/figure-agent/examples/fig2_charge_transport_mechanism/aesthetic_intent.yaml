schema: figure-agent.aesthetic-intent.v2
fixture: fig2_charge_transport_mechanism
target_journal: Nature Communications
visual_maturity: restrained
density: balanced
reference_style: mechanism_schematic
design_principles:
  - id: readout_led_comparison
    instruction: "Make the material comparison visibly lead into the transient-current readout, with the readout receiving the strongest claim-bearing lane."
  - id: embodied_shared_field
    instruction: "Show the held field as a matched condition inside each MIM cell; it must read as a physical operating condition, not as a serial process rail above the cells."
  - id: material_not_card
    instruction: "Use a quiet common MIM cross-section grammar; material identity must come from the internal physical cue, not heavy card outlines."
  - id: flat_mim_layer_hierarchy
    instruction: "Render matched MIM cells as flat metal / polymer-film / metal sections; the film fill is the material body, while sparse interior cues must remain subordinate."
  - id: bound_dipole_pairing
    instruction: "When orientation polarization is the explanatory cue, draw compact neutral oval dipole bodies with paired poles aligned to the held field, rather than bare arrows or free signs that can be mistaken for carrier flow."
  - id: restrained_analytic_index
    instruction: "Keep the transient curve as a clear qualitative analytic index, never a faux measured plot, a time-calibrated mini-graph, or a generic decorative zig-zag."
  - id: log_log_power_law_grammar
    instruction: "Use a standard symbolic log I--log t transient: a straight early power-law segment, a neutral dashed early-fit extrapolation, and a solid late departure above it. Do not turn panel d's material-specific normalization into the mechanism-strip readout or fabricate an ideal-dielectric trace."
must_avoid:
  - id: slide_banner_grammar
    pattern: "A large title, long condition banner, and equal-weight columns dominate the mechanism or make the strip read as a presentation slide."
    severity: MAJOR
  - id: toy_material_icons
    pattern: "Bullseye localized-state markers, repeated geometric zig-zags, or heavy boxed cells make the material state read as a preset icon rather than a scientific schematic."
    severity: MAJOR
  - id: accent_role_collision
    pattern: "One accent color is reused for unrelated condition, material, and response roles without a stated semantic distinction."
    severity: MAJOR
polish_triggers:
  - id: source_geometry_refinement
    condition: "Composition, material texture, label hierarchy, or color-role repair remains necessary."
    recommended_path: continue_tikz
  - id: optical_finish_only
    condition: "Source semantics and current render geometry are locked, with only sub-pixel stroke or spacing finish remaining."
    recommended_path: ready_for_svg_polish
aesthetic_levers:
  - id: causal_hierarchy
    dimension: hero_hierarchy
    intent: "The eye should travel from matched material states to the sulfur-owned transient-current readout without treating the readout as a detached third card."
    priority: required
    positive_signals:
      - "the shared condition is a quiet header, not a visual rail competing with the mechanism"
      - "the sulfur working state has enough visual occupancy to own the interpretation"
      - "the readout is the clear destination of the comparison and has a dedicated open lane"
    anti_patterns:
      - "equal-width illustrated cards and a visually orphaned mini-plot"
      - "a handoff arrow that terminates in whitespace rather than the readout boundary"
      - "a text banner receives the first fixation"
    allowed_adjustments:
      - "rebalance material and readout lane widths"
      - "reduce condition or title prominence"
      - "redraw the qualitative trace while preserving its early-before-late semantics"
    forbidden_adjustments:
      - "convert the conceptual dielectric reference into a measured material control"
      - "assign charge sign, trap depth, or a microscopic hopping pathway"
      - "replace the qualitative readout with synthetic data"
    default_route: tikz_patch
  - id: material_texture_authorship
    dimension: component_fidelity
    intent: "Make conventional bound polarization and sulfur localized states visually distinct through restrained material cues rather than repeated icon primitives."
    priority: required
    positive_signals:
      - "conventional bound polarization remains sparse and quiet"
      - "short linked sulfur-toned fragments read as a bounded amorphous matrix rather than repeated smooth worms or detached V-shaped scraps"
      - "six equal-size localized-state marks are irregularly distributed and directly embedded in host fragments without encoding density"
      - "localized states carry an explicitly qualified working-model label without asserting leakage suppression or a hopping route"
    anti_patterns:
      - "bullseye or winged-dot trap icons"
      - "long periodic or sawtooth host paths"
      - "multiple similarly smooth in-film curves that read as biological worms"
      - "a continuous conduction wire or carrier-arrow route through the sulfur film"
      - "straight interrupted linework that reads as a molecular chain, worm, or unearned transport path"
      - "heavy apparatus borders doing the work of material identity"
    allowed_adjustments:
      - "redraw host paths and local state marks"
      - "thin or remove non-semantic frame edges"
      - "vary bounded trace curvature and contrast"
    forbidden_adjustments:
      - "invent charge polarity, trap magnitude, or phase segregation"
      - "add a covalent network or a specific microscopic transport route"
    default_route: semantic_backport
  - id: flat_mim_layer_hierarchy
    dimension: device_projection
    intent: "Make both MIM cells read as matched two-terminal cross-sections before the reader interprets the material-specific interior cue."
    priority: required
    positive_signals:
      - "top and bottom electrodes have identical flat slab grammar"
      - "the polymer film is a continuous quiet region bounded by the two interfaces"
      - "interior traces are visibly subordinate to the film and electrode boundaries"
    anti_patterns:
      - "beveled or pseudo-3D electrode bars"
      - "interior polymer traces that read as a free particle path or covalent network"
      - "duplicated layer labels that overwhelm the matched comparison"
    allowed_adjustments:
      - "redraw layer fills, interfaces, and sparse local material cues"
      - "adjust local state scale and trace contrast"
    forbidden_adjustments:
      - "invent a specific electrode metal, carrier polarity, or hopping pathway"
      - "introduce a perspective side face or decorative device shadow"
    default_route: semantic_backport
  - id: bound_dipole_pairing
    dimension: physics_cue_legibility
    intent: "Let the conventional reference read as field-aligned orientation polarization without assigning a mobile carrier sign."
    priority: required
    positive_signals:
      - "each polar unit visibly owns its paired negative and positive poles"
      - "all oval dipole bodies align with the held field while remaining inside the film"
    anti_patterns:
      - "isolated arrows that can read as charge-carrier transport"
      - "unpaired signed carriers dispersed through the ideal film"
      - "a circle-pair ion model or a repeated p-vector arrow that competes with the common applied-field cue"
    allowed_adjustments:
      - "adjust oval aspect ratio, spacing, and restrained blue contrast"
    forbidden_adjustments:
      - "use the dipole signs to assert a net carrier polarity or free-charge population"
    default_route: semantic_backport
  - id: field_condition_embodiment
    dimension: causal_legibility
    intent: "Make the common applied field visible where it acts, while keeping material states as a lateral comparison rather than a two-step process."
    priority: required
    positive_signals:
      - "each matched MIM cell visibly carries the same field-direction cue"
      - "the numeric field condition remains one quiet shared experimental statement"
      - "the material comparison remains lateral even when the readout arrow is present"
    anti_patterns:
      - "an abstract overhead rail or hanging taps that can be read as a serial process path"
      - "a decorative voltage-source cartoon or a polarity claim not supported by the experiment"
      - "duplicated condition banners that compete with material identity"
    allowed_adjustments:
      - "redraw the field cue inside the MIM cross-sections"
      - "move the shared condition into a quieter typographic lane"
      - "rebalance the field cue against the material texture"
    forbidden_adjustments:
      - "imply source-off during current acquisition"
      - "infer a charge polarity from the held-field cue"
    default_route: semantic_backport
  - id: color_and_stroke_economy
    dimension: color_harmony
    intent: "Reserve blue for the conventional reference/control-response family, amber for sulfur host identity, and red for sulfur late-response emphasis while gray carries apparatus and context."
    priority: required
    positive_signals:
      - "the held-field condition is neutral rather than a competing red claim"
      - "red appears only on the localized-state/result family"
      - "support rules and axes stay lighter than the readout trace"
    anti_patterns:
      - "red reused for the condition rail, field guide, and result curve"
      - "all outlines share one heavy weight"
      - "axes or separators dominate material marks"
    allowed_adjustments:
      - "desaturate or gray out context"
      - "rebalance stroke hierarchy"
      - "remove redundant support rules"
    forbidden_adjustments:
      - "change the declared material-color ownership"
      - "hide the required field-on condition"
    default_route: tikz_patch
  - id: print_scale_typography
    dimension: typography_authority
    intent: "Keep the title, conditions, material names, and two readout-window labels in a controlled hierarchy at the final full-width reduction."
    priority: required
    positive_signals:
      - "panel letter is navigational rather than dominant"
      - "condition text is subordinate to the material/readout story"
      - "support labels retain their own lanes at 50 and 33 percent review"
    anti_patterns:
      - "title/banner competes with the material panels"
      - "italic support prose fills the gutters"
      - "labels rely on zoom to separate from axes or state marks"
    allowed_adjustments:
      - "tighten copy and local spacing"
      - "adjust text weight and lane placement"
      - "reallocate whitespace between the comparison and readout"
    forbidden_adjustments:
      - "remove field, humidity, or readout-window meaning"
      - "change variable names or time-window claims"
    default_route: tikz_patch
  - id: log_log_power_law_grammar
    dimension: semantic_plot_grammar
    intent: "Make a conventional early power law and its later departure readable as plot geometry, while leaving the material-specific normalized comparison to the quantitative data panels."
    priority: required
    positive_signals:
      - "the axes explicitly state log I and log t without numerical ticks"
      - "a straight early segment visibly establishes the power-law grammar"
      - "a neutral dashed continuation is visibly distinct from the solid response"
      - "the red late response departs above the early-fit extrapolation"
    anti_patterns:
      - "an absolute-current comparison or ideal-dielectric trace offered without matched evidence"
      - "a panel-specific normalization metric presented as a generic material icon"
      - "a t=0 tick on a logarithmic time axis"
      - "a dotted late response when the dotted mark is not the reference projection"
    allowed_adjustments:
      - "redraw the early and late trace segments inside the fixed readout bounds"
      - "rebalance the extrapolation and late-departure annotation lanes"
    forbidden_adjustments:
      - "add fitted exponent values, synthetic scatter data, or a Debye reference curve"
      - "turn the qualitative readout into a calibrated data panel"
    default_route: semantic_backport
