schema: figure-agent.failure-first-semantic-contract.v1
selector_id: fig2.charge_transport_mechanism

required_objects:
  - panel_a.measurement_context
  - panel_a.mim_stack
  - panel_a.field_condition
  - panel_a.reference_dielectric
  - panel_a.bound_dipoles
  - panel_a.sulfur_copolymer
  - panel_a.localized_charge_states
  - panel_a.field_held_on
  - panel_a.transient_readout
  - panel_a.log_log_axes
  - panel_a.early_power_law
  - panel_a.early_fit_extrapolation
  - panel_a.late_departure

forbidden_implications:
  - panel_a.quantitative_transient_measurement
  - panel_a.calibrated_trap_density
  - panel_a.exact_exponent_value
  - panel_a.s_s_energy_diagram
  - panel_a.decorative_retention_loop
  - panel_a.infographic_card_grid
  - panel_a.universal_ideal_dielectric_law
  - panel_a.actuation_charging_setup
  - panel_a.second_electrical_measurement_instrument
  - panel_a.signed_carrier_inference
  - panel_a.source_off_during_transient
  - panel_a.calibrated_trap_depth_or_density
  - panel_a.time_calibrated_mini_graph
  - panel_a.normalized_deviation_metric
  - panel_a.unmeasured_ideal_current_control
  - panel_a.direct_mobile_leakage_suppression_claim

protected_relations:
  - mim_stack_contains_polymer_film_between_electrodes
  - mim_comparison_uses_matched_footprints
  - held_field_binds_lateral_material_comparison
  - reference_and_sulfur_are_sibling_comparison_states
  - reference_baseline_shows_bound_dipoles_without_free_carrier_flow
  - sulfur_working_picture_uses_sign_neutral_localized_charge_cues
  - field_is_held_on_throughout_current_acquisition
  - transient_readout_uses_standard_log_log_current_grammar
  - sulfur_trace_has_early_power_law_and_late_departure
  - late_departure_is_shown_against_early_fit_extrapolation
  - quantitative_cross_material_comparison_is_pipeline_owned
  - localized_states_are_a_qualified_working_model_not_direct_proof
  - strip_is_schematic_and_data_panels_are_pipeline_owned

repair:
  family: fig2_mechanism_strip
  selector_id: fig2.charge_transport_mechanism
  max_source_blocks: 1

semantic_legibility:
  object_roles:
    - object_id: panel_a.measurement_context
      declared_role: held_field_charging_current_measurement_context
      forbidden_readings: [actuation_setup, discharge_measurement, charging_instrument]
    - object_id: panel_a.mim_stack
      declared_role: matched_metal_insulator_metal_cross_section
      forbidden_readings: [cantilever, free_air_gap]
    - object_id: panel_a.field_condition
      declared_role: constant_applied_field_condition
      forbidden_readings: [source_off_or_discharge_interval, exact_voltage_source_schematic]
    - object_id: panel_a.reference_dielectric
      declared_role: conceptual_conventional_dielectric_reference
      forbidden_readings: [ideal_measured_control, measured_PI_PTFE_or_PET_control]
    - object_id: panel_a.bound_dipoles
      declared_role: field_aligned_orientation_polarization_cue
      forbidden_readings: [free_carrier_or_charge_drain]
    - object_id: panel_a.sulfur_copolymer
      declared_role: sulfur_rich_comparison_material
      forbidden_readings: [separate_particle_phase]
    - object_id: panel_a.localized_charge_states
      declared_role: qualified_sign_neutral_localized_state_working_model
      forbidden_readings: [carrier_polarity, calibrated_charge_density, trap_energy_distribution, direct_leakage_suppression]
    - object_id: panel_a.field_held_on
      declared_role: acquisition_condition_continuity
      forbidden_readings: [source_off_or_discharge_interval]
    - object_id: panel_a.transient_readout
      declared_role: qualitative_log_log_current_readout
      forbidden_readings: [normalized_deviation_metric, quantitative_data_panel]
    - object_id: panel_a.log_log_axes
      declared_role: symbolic_logarithmic_current_and_time_axis_grammar
      forbidden_readings: [linear_time_axis, calibrated_time_ticks, calibrated_current_ticks]
    - object_id: panel_a.early_power_law
      declared_role: qualitative_early_power_law_segment
      forbidden_readings: [exact_exponent_value, calibrated_sample_trace]
    - object_id: panel_a.early_fit_extrapolation
      declared_role: qualitative_early_fit_extrapolation
      forbidden_readings: [measured_control_trace, calibrated_predictive_trace]
    - object_id: panel_a.late_departure
      declared_role: qualitative_late_time_departure_from_early_fit
      forbidden_readings: [material_wide_effect, calibrated_sample_trace]
  visible_connectors:
    - connector_id: panel_a.held_field_to_reference
      from_object: panel_a.measurement_context
      to_object: panel_a.reference_dielectric
      declared_role: shared_operating_condition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.held_field_to_sulfur
      from_object: panel_a.measurement_context
      to_object: panel_a.sulfur_copolymer
      declared_role: shared_operating_condition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.reference_to_readout
      from_object: panel_a.reference_dielectric
      to_object: panel_a.transient_readout
      declared_role: comparison_readout_membership
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.sulfur_to_readout
      from_object: panel_a.sulfur_copolymer
      to_object: panel_a.transient_readout
      declared_role: comparison_readout_membership
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.localized_states_to_sulfur_readout
      from_object: panel_a.localized_charge_states
      to_object: panel_a.late_departure
      declared_role: qualified_working_model_link
      render_style: stage_transition
      epistemic_status: qualified_inference
  parallel_comparisons:
    - comparison_id: panel_a.material_states
      members: [panel_a.reference_dielectric, panel_a.sulfur_copolymer]
      shared_input: panel_a.measurement_context
      shared_output: panel_a.transient_readout
      comparison_basis: schematic_state
      input_connector_ids:
        - panel_a.held_field_to_reference
        - panel_a.held_field_to_sulfur
      output_connector_ids:
        - panel_a.reference_to_readout
        - panel_a.sulfur_to_readout
  forbidden_connectors:
    - from_object: panel_a.measurement_context
      to_object: panel_a.sulfur_copolymer
      declared_role: actuation_force
    - from_object: panel_a.localized_charge_states
      to_object: panel_a.transient_readout
      declared_role: calibrated_data_fit
  label_ownership:
    - label_id: panel_a.measurement_header
      owner: panel_a.measurement_context
    - label_id: panel_a.field_label
      owner: panel_a.field_condition
    - label_id: panel_a.reference_header
      owner: panel_a.reference_dielectric
    - label_id: panel_a.sulfur_header
      owner: panel_a.sulfur_copolymer
    - label_id: panel_a.early_power_law_label
      owner: panel_a.early_power_law
    - label_id: panel_a.late_departure_label
      owner: panel_a.late_departure
publication_acceptance: not_claimed
