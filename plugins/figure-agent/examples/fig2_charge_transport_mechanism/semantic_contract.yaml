schema: figure-agent.failure-first-semantic-contract.v1
selector_id: fig2.charge_transport_mechanism

required_objects:
  - panel_a.measurement_context
  - panel_a.mim_stack
  - panel_a.field_condition
  - panel_a.ideal_dielectric
  - panel_a.bound_dipoles
  - panel_a.fast_polarization
  - panel_a.sulfur_copolymer
  - panel_a.localized_charge_states
  - panel_a.leakage_suppression
  - panel_a.long_lived_relaxation
  - panel_a.field_held_on
  - panel_a.transient_readout
  - panel_a.log_log_axes
  - panel_a.early_window
  - panel_a.late_window
  - panel_a.early_fit_reference

forbidden_implications:
  - panel_a.quantitative_transient_measurement
  - panel_a.calibrated_trap_density
  - panel_a.exact_exponent_value
  - panel_a.s_s_energy_diagram
  - panel_a.decorative_retention_loop
  - panel_a.infographic_card_grid
  - panel_a.universal_ideal_dielectric_law
  - panel_a.actuation_charging_setup
  - panel_a.second_electrical_measurement_instrument
  - panel_a.signed_carrier_inference
  - panel_a.source_off_during_transient
  - panel_a.calibrated_trap_depth_or_density
  - panel_a.time_calibrated_mini_graph

protected_relations:
  - mim_stack_contains_polymer_film_between_electrodes
  - mim_comparison_uses_matched_footprints
  - held_field_binds_lateral_material_comparison
  - ideal_and_sulfur_are_sibling_comparison_states
  - lateral_material_comparison_feeds_common_readout
  - ideal_baseline_shows_bound_dipoles_without_free_carrier_flow
  - sulfur_working_picture_uses_sign_neutral_localized_charge_cues
  - localized_capture_suppresses_mobile_leakage_before_slow_relaxation
  - field_is_held_on_throughout_current_acquisition
  - transient_readout_uses_response_trace_with_early_fit_reference
  - transient_readout_declares_log_log_power_law_geometry
  - early_window_precedes_late_window
  - localized_state_relaxation_is_the_qualitative_cause_of_the_late_residual
  - strip_is_schematic_and_data_panels_are_pipeline_owned

repair:
  family: fig2_mechanism_strip
  selector_id: fig2.charge_transport_mechanism
  max_source_blocks: 1

semantic_legibility:
  object_roles:
    - object_id: panel_a.measurement_context
      declared_role: discharge_measurement_context
      forbidden_readings: [actuation_setup, charging_instrument]
    - object_id: panel_a.mim_stack
      declared_role: metal_insulator_metal_stack
      forbidden_readings: [cantilever, free_air_gap]
    - object_id: panel_a.field_condition
      declared_role: applied_field_context
      forbidden_readings: [exact_voltage_source_schematic]
    - object_id: panel_a.ideal_dielectric
      declared_role: conceptual_ideal_dielectric_baseline
      forbidden_readings: [measured_PI_PTFE_or_PET_control]
    - object_id: panel_a.bound_dipoles
      declared_role: field_aligned_orientation_polarization_cue
      forbidden_readings: [free_carrier_or_charge_drain]
    - object_id: panel_a.fast_polarization
      declared_role: pre_analysis_window_response
      forbidden_readings: [measured_current_trace]
    - object_id: panel_a.sulfur_copolymer
      declared_role: sulfur_rich_comparison_material
      forbidden_readings: [separate_particle_phase]
    - object_id: panel_a.localized_charge_states
      declared_role: sign_neutral_working_charge_localization_cue
      forbidden_readings: [carrier_polarity, calibrated_charge_density, trap_energy_distribution]
    - object_id: panel_a.leakage_suppression
      declared_role: qualitative_interrupted_mobile_leakage_cue
      forbidden_readings: [specific_hopping_route, signed_carrier_current, calibrated_conductance]
    - object_id: panel_a.long_lived_relaxation
      declared_role: qualitative_late_time_relaxation_cue
      forbidden_readings: [direct_trap_depth_or_density_measurement]
    - object_id: panel_a.field_held_on
      declared_role: constant_applied_field_condition
      forbidden_readings: [source_off_or_discharge_interval]
    - object_id: panel_a.transient_readout
      declared_role: qualitative_log_log_two_window_readout_icon
      forbidden_readings: [quantitative_data_panel]
    - object_id: panel_a.log_log_axes
      declared_role: symbolic_logarithmic_axis_grammar
      forbidden_readings: [linear_time_axis, calibrated_y_axis]
    - object_id: panel_a.early_window
      declared_role: early_fit_window
      forbidden_readings: [exact_fit_result]
    - object_id: panel_a.late_window
      declared_role: late_fit_window
      forbidden_readings: [exact_fit_result]
    - object_id: panel_a.early_fit_reference
      declared_role: qualitative_early_fit_extrapolation
      forbidden_readings: [calibrated_predictive_trace, measured_control_trace]
  visible_connectors:
    - connector_id: panel_a.held_field_to_ideal
      from_object: panel_a.measurement_context
      to_object: panel_a.ideal_dielectric
      declared_role: story_stage_transition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.held_field_to_sulfur
      from_object: panel_a.measurement_context
      to_object: panel_a.sulfur_copolymer
      declared_role: story_stage_transition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.ideal_to_readout
      from_object: panel_a.ideal_dielectric
      to_object: panel_a.transient_readout
      declared_role: readout_transition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.sulfur_to_readout
      from_object: panel_a.sulfur_copolymer
      to_object: panel_a.transient_readout
      declared_role: readout_transition
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.localized_relaxation_to_late_window
      from_object: panel_a.long_lived_relaxation
      to_object: panel_a.late_window
      declared_role: qualitative_causal_working_model
      render_style: stage_transition
      epistemic_status: derived
    - connector_id: panel_a.readout_owns_early_window
      from_object: panel_a.transient_readout
      to_object: panel_a.early_window
      declared_role: fit_window_ownership
      render_style: response_trace
    - connector_id: panel_a.readout_owns_late_window
      from_object: panel_a.transient_readout
      to_object: panel_a.late_window
      declared_role: fit_window_ownership
      render_style: response_trace
  parallel_comparisons:
    - comparison_id: panel_a.material_states
      members: [panel_a.ideal_dielectric, panel_a.sulfur_copolymer]
      shared_input: panel_a.measurement_context
      shared_output: panel_a.transient_readout
      comparison_basis: schematic_state
      input_connector_ids:
        - panel_a.held_field_to_ideal
        - panel_a.held_field_to_sulfur
      output_connector_ids:
        - panel_a.ideal_to_readout
        - panel_a.sulfur_to_readout
  forbidden_connectors:
    - from_object: panel_a.measurement_context
      to_object: panel_a.sulfur_copolymer
      declared_role: actuation_force
    - from_object: panel_a.localized_charge_states
      to_object: panel_a.transient_readout
      declared_role: calibrated_data_fit
  label_ownership:
    - label_id: panel_a.measurement_header
      owner: panel_a.measurement_context
    - label_id: panel_a.field_label
      owner: panel_a.field_condition
    - label_id: panel_a.ideal_header
      owner: panel_a.ideal_dielectric
    - label_id: panel_a.sulfur_header
      owner: panel_a.sulfur_copolymer
    - label_id: panel_a.early_window_label
      owner: panel_a.early_window
    - label_id: panel_a.late_window_label
      owner: panel_a.late_window
publication_acceptance: not_claimed
