schema: figure-agent.failure-first-semantic-contract.v1
selector_id: figure1.redraw_v1
required_objects:
  - panel_a.elemental_s8
  - panel_a.dib_comonomer
  - panel_a.inverse_vulcanization
  - panel_a.representative_bis_thiocumyl_motif
  - panel_a.variable_sulfur_rank
  - panel_b.s60_sample
  - panel_b.s75_sample
  - panel_b.s85_sample
  - panel_b.qualitative_sulfur_rank_progression
  - panel_c.trap_landscape
  - panel_c.real_space_host
  - panel_c.shallow_trap_population
  - panel_c.deep_trap_population
  - panel_c.energy_diagram
  - panel_c.correspondence
  - panel_d.transient_current
  - panel_d.constant_voltage_condition
  - panel_d.measured_power_law
  - panel_d.single_relaxation_reference
  - panel_e.corona_charging_state
  - panel_e.manual_transfer
  - panel_e.ispd_probe
  - panel_e.surface_potential_decay
  - panel_e.raw_to_derived_transform
  - panel_e.derived_trap_distribution
  - panel_f.open_clip_terminal
  - panel_f.mechanical_jig
  - panel_f.cantilever
  - panel_f.electrode
  - panel_f.voltage_source
  - panel_f.ground_reference
  - panel_f.observed_bend_direction
forbidden_implications:
  - panel_a.unique_constitutional_repeat
  - panel_a.covalent_crosslink_network
  - panel_b.sample_number_as_sulfur_atom_count
  - panel_b.exact_composition_derived_chain_length
  - panel_f.grounded_sample
  - panel_f.grounded_cantilever
  - panel_f.electrical_contact_at_jig
  - panel_f.second_contact
repair:
  family: full_figure_redraw_candidate
  selector_id: figure1.redraw_v1
  max_source_blocks: 6
protected_relations:
  - inverse_vulcanization_transforms_s8_and_dib_into_representative_motif
  - representative_motif_contains_variable_not_fixed_sulfur_rank
  - s60_s75_s85_are_sulfur_weight_percent_sample_identities
  - drawn_sulfur_glyph_count_is_qualitative_not_measured_chain_length
  - shallow_and_deep_traps_share_one_energy_orientation
  - real_space_trap_populations_correspond_to_energy_diagram_states
  - transient_current_decays_under_constant_voltage
  - measured_power_law_has_no_single_relaxation_cutoff
  - corona_charged_sample_is_manually_transferred_to_noncontact_ispd_measurement
  - surface_potential_decay_is_transformed_into_derived_trap_distribution
  - derived_trap_distribution_is_one_continuous_population_without_a_drawn_ratio
  - ispd_probe_remains_separate_from_sample_surface
  - mechanical_jig_holds_cantilever
  - cantilever_separated_from_electrode_by_air_gap
  - voltage_source_drives_electrode
  - voltage_source_returns_to_ground
  - cantilever_remains_electrically_floating
semantic_legibility:
  object_roles:
    - object_id: panel_a.elemental_s8
      declared_role: elemental_sulfur_reactant
      forbidden_readings:
        - decorative_sulfur_icon
    - object_id: panel_a.dib_comonomer
      declared_role: divinyl_aromatic_comonomer
      forbidden_readings:
        - saturated_aromatic_substitute
    - object_id: panel_a.inverse_vulcanization
      declared_role: thermally_driven_reaction
      forbidden_readings:
        - third_chemical_reagent
    - object_id: panel_a.representative_bis_thiocumyl_motif
      declared_role: representative_primary_structure_motif
      forbidden_readings:
        - unique_constitutional_repeat
        - covalent_crosslink_network
    - object_id: panel_a.variable_sulfur_rank
      declared_role: statistical_polysulfide_rank
      forbidden_readings:
        - fixed_stoichiometric_subscript
    - object_id: panel_b.s60_sample
      declared_role: sulfur_weight_percent_sample_identity
      forbidden_readings:
        - sixty_sulfur_atom_chain
    - object_id: panel_b.s75_sample
      declared_role: sulfur_weight_percent_sample_identity
      forbidden_readings:
        - seventy_five_sulfur_atom_chain
    - object_id: panel_b.s85_sample
      declared_role: sulfur_weight_percent_sample_identity
      forbidden_readings:
        - eighty_five_sulfur_atom_chain
    - object_id: panel_b.qualitative_sulfur_rank_progression
      declared_role: schematic_ordinal_composition_encoding
      forbidden_readings:
        - measured_chain_length_scale
        - exact_molecular_distribution
    - object_id: panel_c.trap_landscape
      declared_role: energy_landscape
      forbidden_readings: [quantitative_density_fit]
    - object_id: panel_c.real_space_host
      declared_role: amorphous_polymer_matrix
      forbidden_readings: [lamellar_texture, surface_topography]
    - object_id: panel_c.shallow_trap_population
      declared_role: localized_shallow_trap_sites
      forbidden_readings: [separate_particle_phase]
    - object_id: panel_c.deep_trap_population
      declared_role: localized_deep_trap_sites
      forbidden_readings: [separate_particle_phase]
    - object_id: panel_c.energy_diagram
      declared_role: schematic_energy_domain_view
      forbidden_readings: [calibrated_density_fit]
    - object_id: panel_c.correspondence
      declared_role: population_mapping_between_views
      forbidden_readings: [transport_trajectory]
    - object_id: panel_d.transient_current
      declared_role: qualitative_decay_plot
      forbidden_readings: [calibrated_measurement]
    - object_id: panel_d.constant_voltage_condition
      declared_role: operating_condition
      forbidden_readings: [measured_curve]
    - object_id: panel_d.measured_power_law
      declared_role: qualitative_measured_power_law_decay
      forbidden_readings: [fitted_numeric_exponent, second_material_comparison]
    - object_id: panel_d.single_relaxation_reference
      declared_role: idealised_single_relaxation_model_reference
      forbidden_readings: [measured_control, second_material_comparison]
    - object_id: panel_e.corona_charging_state
      declared_role: gridless_two_terminal_charging_state
      forbidden_readings: [kelvin_probe_station, grounded_charging_stage]
    - object_id: panel_e.manual_transfer
      declared_role: discrete_manual_sample_relocation
      forbidden_readings: [automated_motion_stage, conveyor_scan]
    - object_id: panel_e.ispd_probe
      declared_role: noncontact_measurement_probe
      forbidden_readings: [sample_electrode]
    - object_id: panel_e.surface_potential_decay
      declared_role: raw_surface_potential_decay
      forbidden_readings: [calibrated_fit_points]
    - object_id: panel_e.raw_to_derived_transform
      declared_role: measurement_to_distribution_transformation
      forbidden_readings: [floating_down_arrow]
    - object_id: panel_e.derived_trap_distribution
      declared_role: qualitative_trap_density_distribution
      forbidden_readings: [source_bound_data_points]
    - object_id: panel_f.mechanical_jig
      declared_role: mechanical_fixture
      forbidden_readings: [electrical_contact]
    - object_id: panel_f.open_clip_terminal
      declared_role: unconnected_clip_terminal
      forbidden_readings: [connected_terminal, ground_reference]
    - object_id: panel_f.cantilever
      declared_role: mechanical_member
      forbidden_readings: [grounded_conductor]
    - object_id: panel_f.electrode
      declared_role: active_electrode
      forbidden_readings: [ground_reference]
    - object_id: panel_f.voltage_source
      declared_role: compact_voltage_source
      forbidden_readings: [instrument_display]
    - object_id: panel_f.ground_reference
      declared_role: source_return_ground
      forbidden_readings: [sample_ground]
    - object_id: panel_f.observed_bend_direction
      declared_role: directed_observation
      forbidden_readings: [annotation_leader, established_mechanism_name]
  visible_connectors:
    - connector_id: panel_a.s8_enters_inverse_vulcanization
      from_object: panel_a.elemental_s8
      to_object: panel_a.inverse_vulcanization
      declared_role: reaction_input
      render_style: reaction_scheme
    - connector_id: panel_a.dib_enters_inverse_vulcanization
      from_object: panel_a.dib_comonomer
      to_object: panel_a.inverse_vulcanization
      declared_role: reaction_input
      render_style: reaction_scheme
    - connector_id: panel_a.inverse_vulcanization_yields_representative_motif
      from_object: panel_a.inverse_vulcanization
      to_object: panel_a.representative_bis_thiocumyl_motif
      declared_role: reaction_output
      render_style: reaction_scheme
    - connector_id: panel_a.variable_rank_qualifies_representative_motif
      from_object: panel_a.variable_sulfur_rank
      to_object: panel_a.representative_bis_thiocumyl_motif
      declared_role: structural_qualification
      render_style: subscript_and_caption
    - connector_id: panel_b.progression_orders_s60
      from_object: panel_b.qualitative_sulfur_rank_progression
      to_object: panel_b.s60_sample
      declared_role: ordinal_composition_encoding
      render_style: wt_percent_axis
    - connector_id: panel_b.progression_orders_s75
      from_object: panel_b.qualitative_sulfur_rank_progression
      to_object: panel_b.s75_sample
      declared_role: ordinal_composition_encoding
      render_style: wt_percent_axis
    - connector_id: panel_b.progression_orders_s85
      from_object: panel_b.qualitative_sulfur_rank_progression
      to_object: panel_b.s85_sample
      declared_role: ordinal_composition_encoding
      render_style: wt_percent_axis
    - connector_id: panel_c.shallow_population_corresponds_to_energy_state
      from_object: panel_c.shallow_trap_population
      to_object: panel_c.energy_diagram
      declared_role: semantic_correspondence
      render_style: population_correspondence
    - connector_id: panel_c.deep_population_corresponds_to_energy_state
      from_object: panel_c.deep_trap_population
      to_object: panel_c.energy_diagram
      declared_role: semantic_correspondence
      render_style: population_correspondence
    - connector_id: panel_d.constant_voltage_owns_transient
      from_object: panel_d.constant_voltage_condition
      to_object: panel_d.transient_current
      declared_role: operating_condition
      render_style: condition_label
    - connector_id: panel_d.measured_trace_is_current_response
      from_object: panel_d.transient_current
      to_object: panel_d.measured_power_law
      declared_role: qualitative_response_trace
      render_style: response_trace
    - connector_id: panel_d.reference_trace_contrasts_current_response
      from_object: panel_d.transient_current
      to_object: panel_d.single_relaxation_reference
      declared_role: idealised_model_contrast
      render_style: response_trace
    - connector_id: panel_e.charging_state_transfers_to_measurement_state
      from_object: panel_e.corona_charging_state
      to_object: panel_e.manual_transfer
      declared_role: process_stage_transition
      render_style: stage_transition
    - connector_id: panel_e.manual_transfer_places_sample_under_ispd_probe
      from_object: panel_e.manual_transfer
      to_object: panel_e.ispd_probe
      declared_role: process_stage_transition
      render_style: stage_transition
    - connector_id: panel_e.ispd_probe_produces_surface_potential_decay
      from_object: panel_e.ispd_probe
      to_object: panel_e.surface_potential_decay
      declared_role: measurement_acquisition
      render_style: measurement_result
    - connector_id: panel_e.decay_feeds_raw_to_derived_transform
      from_object: panel_e.surface_potential_decay
      to_object: panel_e.raw_to_derived_transform
      declared_role: measurement_transformation
      render_style: transformation_arrow
    - connector_id: panel_e.transform_outputs_trap_distribution
      from_object: panel_e.raw_to_derived_transform
      to_object: panel_e.derived_trap_distribution
      declared_role: measurement_transformation
      render_style: transformation_arrow
    - connector_id: panel_f.jig_holds_cantilever
      from_object: panel_f.mechanical_jig
      to_object: panel_f.cantilever
      declared_role: mechanical_attachment
      render_style: mechanical_structural
    - connector_id: panel_f.source_drives_electrode
      from_object: panel_f.voltage_source
      to_object: panel_f.electrode
      declared_role: electrical_bias_lead
      render_style: electrical_bias_lead
    - connector_id: panel_f.source_returns_to_ground
      from_object: panel_f.voltage_source
      to_object: panel_f.ground_reference
      declared_role: grounded_source_return
      render_style: electrical_ground_return
    - connector_id: panel_f.observed_bend_acts_on_cantilever
      from_object: panel_f.observed_bend_direction
      to_object: panel_f.cantilever
      declared_role: observed_direction
      render_style: force_directional
      epistemic_status: derived
  forbidden_connectors:
    - from_object: panel_f.mechanical_jig
      to_object: panel_f.cantilever
      declared_role: electrical_contact
    - from_object: panel_f.cantilever
      to_object: panel_f.ground_reference
      declared_role: ground_return
  label_ownership:
    - label_id: panel_a.variable_rank_label
      owner: panel_a.variable_sulfur_rank
    - label_id: panel_b.s60_label
      owner: panel_b.s60_sample
    - label_id: panel_b.s75_label
      owner: panel_b.s75_sample
    - label_id: panel_b.s85_label
      owner: panel_b.s85_sample
    - label_id: panel_e.derive_label
      owner: panel_e.raw_to_derived_transform
    - label_id: panel_f.hypothesised_charge_label
      owner: panel_f.cantilever
    - label_id: panel_f.air_gap_label
      owner: panel_f.cantilever
    - label_id: panel_f.applied_voltage_label
      owner: panel_f.voltage_source
  electrical_topology:
    nodes:
      - object_id: panel_f.mechanical_jig
        declared_state: electrically_unmodeled
      - object_id: panel_f.cantilever
        declared_state: floating
      - object_id: panel_f.electrode
        declared_state: driven
      - object_id: panel_f.voltage_source
        declared_state: source
      - object_id: panel_f.ground_reference
        declared_state: ground_reference
    connections:
      - connection_id: panel_f.source_drives_electrode
        from_object: panel_f.voltage_source
        to_object: panel_f.electrode
        declared_role: electrical_bias_lead
      - connection_id: panel_f.source_returns_to_ground
        from_object: panel_f.voltage_source
        to_object: panel_f.ground_reference
        declared_role: grounded_source_return
publication_acceptance: not_claimed
