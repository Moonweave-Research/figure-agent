panels:
  - id: A
    caption: polymer repeat-unit schematic
    semantic_claims:
      - id: representative-primary-structure
        claim: elemental S8 and 1,3-DIB undergo thermally driven inverse vulcanization to form a representative DIB-linked repeat unit with variable polysulfide rank. The drawn S-C(CH3)2-Ar connectivity is retained; the name bis(thiocumyl) is not used in the manuscript and is not drawn.
    locked_invariants:
      - id: representative-not-unique-repeat
        invariant: the drawn product is a representative primary-structure motif, not a unique constitutional repeat or a declared covalent crosslink network.
  - id: B
    caption: sulfur-content composition series
    semantic_claims:
      - id: sulfur-weight-percent-series
        claim: S60, S75, and S85 identify sulfur weight-percent samples ordered by increasing sulfur content.
    locked_invariants:
      - id: qualitative-sulfur-rank-encoding
        invariant: the number of drawn sulfur glyphs is only a qualitative ordinal correlate and must not be interpreted as a measured molecular sulfur rank, atom count, or exact composition-derived chain length.
  - id: C
    caption: localized trap landscape, balanced dual view
    semantic_claims:
      - id: trap-landscape
        claim: a sulfur-rich polymer carries one continuous distribution of localized states; shallower and deeper regions are zones of that single distribution, shown by shading only.
    locked_invariants:
      - id: energy-orientation
        invariant: energy increases upward; deeper wells are lower in the diagram.
      - id: single-continuous-distribution
        invariant: the localized-state population is drawn as one continuous curve with one maximum; no second peak, no discrete band, and no shallow-to-deep amplitude or area ratio is drawn or claimed.
  - id: D
    caption: transient-current kinetic evidence
    semantic_claims:
      - id: current-decay
        claim: under constant voltage, trap-mediated transient current decays with time.
  - id: E
    caption: ISPD-derived trap distribution evidence
    semantic_claims:
      - id: manual-ispd-sequence
        claim: the same specimen is corona-charged and then manually transferred to non-contact surface-potential measurement.
    locked_invariants:
      - id: stage-specific-grounding
        invariant: the corona-charging station uses the high-voltage supply's two terminals without a grid or earth-ground symbol, while the measurement station grounds the conductive backing beneath the specimen.
      - id: no-relaxation-time-on-the-energy-axis
        invariant: no relaxation-time symbol is drawn on the g(E_t) energy axis; a time plotted on an energy axis is a dimensional error. Author decision 2026-09-03 removed the tau_d span.
      - id: g-et-agrees-with-panel-c
        invariant: g(E_t) is the same single continuous distribution drawn in Panel C with the axes swapped; the two must agree in shape and in carrying no drawn shallow-to-deep ratio.
  - id: F
    caption: floating-clip cantilever bending response
    semantic_claims:
      - id: floating-topology
        claim: the grounded source return does not ground the sample or cantilever; the clip's own terminal is drawn open.
      - id: observed-bend-direction
        claim: the observation asserted by the panel is that the floating cantilever bends away from the driven electrode. The polarity-dependent force is hypothesised, labelled q_tr (hyp.), and named only in the caption.
    locked_invariants:
      - id: observed-bend-direction
        invariant: the observation arrow points away from the driven electrode and is labelled as an observation, not as a named mechanism.
publication_acceptance: not_claimed
