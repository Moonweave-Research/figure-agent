name: fig5_cantilever_actuation_artifact_v2
paper_binding:
  paper_id: pair001
  figure_id: fig5
  role_id: cantilever_actuation_payoff
title: "Fig 5 artifact — polarity-reversal actuation probe"
style_profile: polymer-paper
undeclared_geometry_profile: schematic
visual_clash_cap: 8
review_scale_previews: required
paper_aesthetic_context: nc-main-text-series
journal_art_direction_playbook: nc-main-text
aesthetic_intent: aesthetic_intent.yaml

# This wide, single-row mechanism figure fits the double-column working width
# without approaching the Nature-family 170 mm height guidance.  Declare its
# real PDF geometry rather than inheriting the source's legacy resize value so
# final-reduction type and line review has a physical placement basis.
final_size_contract:
  basis: width_limited_nature_family_main_figure
  natural_size_mm: [180.8, 53.14]
  target_width_mm: 180.0
  max_height_mm: 170.0
  min_print_font_pt: 5.0
  scale_basis: width_limited
  font_floor_scope: explicit_tex_fontsize_declarations
  double_column_reference_mm:
    nature_communications: 180.0
    nature_figure_guide: 183.0
  note: The 180 mm double-column working target produces a 53.3 mm figure height, well below the 170 mm height guidance; explicit type therefore remains above the 5.0 pt readability floor at placement.

# Require object/relation meaning to be declared before strict physics status
# can be treated as grounded.  This is style-independent and coordinate-free.
semantic_contract_required: true

# Reader-facing stage order that can be verified against the rendered text
# without encoding fixture coordinates.  The source-off state precedes the
# reversed drive, which precedes the observed recovery in the qualitative
# response trace.
semantic_assertions:
  - id: source-off-before-reversed-drive
    relation: left_of
    subject: source-off
    reference: reversed-drive
  - id: reversed-drive-before-recovery
    relation: left_of
    subject: reversed-drive
    reference: recovery

tex_assertions:
  - id: initial-force-points-toward-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceToward
    axis: x
    direction: increasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  # The residual vector carries its own direction guard: it uses a dedicated
  # weaker style, so the drive-on assertion above no longer covers it.
  - id: residual-force-points-toward-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceResidual
    axis: x
    direction: increasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  - id: illustrated-coulomb-force-points-away-from-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceAway
    axis: x
    direction: decreasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  # Coordinate-bound source geometry: the fixed-end edges must be bisected by
  # the clamp lead so a future redraw cannot silently paste the support off-axis.
  - id: clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-c-beam-origin
    reference_coordinate: panel-c-clamp-axis
    tolerance_cm: 0.02
  - id: actuation-clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-a-beam-origin
    reference_coordinate: panel-a-clamp-axis
    tolerance_cm: 0.02
  - id: isolation-clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-b-beam-origin
    reference_coordinate: panel-b-clamp-axis
    tolerance_cm: 0.02

# Rendered-PDF morphology checks complement the source-anchor assertions above.
# The film is authored as a thick outer centerline plus a thinner inner stroke,
# so these checks select the outer rendered member rather than requiring a
# closed-path primitive or a fixed Bezier recipe.
silhouette_morphology_checks:
  - id: panel-a-drive-on-member
    representation: stroked_centerline
    role: repeated_cantilever_member
    bbox_pdf_cm: [0.30, 1.00, 4.00, 4.20]
    stroke_rgb: [0.432, 0.34447, 0.08472]
    color_tolerance: 0.02
    linewidth_range_pt: [6.5, 7.0]
    max_width_to_length_ratio: 0.105
  - id: panel-b-residual-member
    representation: stroked_centerline
    role: repeated_cantilever_member
    bbox_pdf_cm: [4.60, 1.00, 8.30, 4.20]
    stroke_rgb: [0.432, 0.34447, 0.08472]
    color_tolerance: 0.02
    linewidth_range_pt: [6.5, 7.0]
    max_width_to_length_ratio: 0.105
  - id: panel-c-reverse-member
    representation: stroked_centerline
    role: repeated_cantilever_member
    bbox_pdf_cm: [8.90, 1.00, 12.70, 4.20]
    stroke_rgb: [0.432, 0.34447, 0.08472]
    color_tolerance: 0.02
    linewidth_range_pt: [6.5, 7.0]
    max_width_to_length_ratio: 0.105

silhouette_morphology_groups:
  - id: repeated-cantilever-sequence
    member_ids:
      - panel-a-drive-on-member
      - panel-b-residual-member
      - panel-c-reverse-member
    max_centerline_length_ratio: 1.06
    max_stroke_width_ratio: 1.03
    absolute_bend_order:
      - panel-b-residual-member
      - panel-c-reverse-member
      - panel-a-drive-on-member
    minimum_bend_step_pt: 5.0
    tip_directions:
      panel-a-drive-on-member: positive
      panel-b-residual-member: positive
      panel-c-reverse-member: negative
    minimum_direction_displacement_pt: 8.0

# A declared intermediate stage must have a visible, ordered reader-facing
# anchor. This is a semantic/render contract, not a primitive recipe.
process_stage_visibility_checks:
  - id: qualitative-response-sequence
    panel_id: D
    reading_axis: x
    minimum_stage_separation_pt: 12.0
    stages:
      - id: observation-origin
        text_phrases:
          - id: actuation-onset-label
            words: [t, "=", "0"]
      - id: source-off-float
        text_phrases:
          - id: source-off-label
            words: ["OFF"]
          - id: floating-label
            words: [floating]
      - id: reversed-drive
        text_phrases:
          - id: reversed-drive-label
            words: [reversed, drive]
      - id: recovery
        text_phrases:
          - id: recovery-label
            words: [recovery]

text_boundary_checks:
  - id: panel-separator-a-b
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 4.46
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-b-c
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 8.92
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-c-d
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 13.38
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-c-coulomb-label-rail
    kind: rect
    role: force_label_rail
    mode: contain_text
    bbox_pdf_cm: [9.45, 2.45, 11.25, 3.00]
    clearance_pt: 0.0
    text_allowlist: [Coulomb]

label_path_proximity_checks:
  - id: panel-b-manual-lead-lift
    kind: polyline
    role: manual_lead_lift
    points_pdf_cm:
      - [5.67, 0.65]
      - [5.91, 0.73]
    clearance_pt: 3.0
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-b-manual-lead-lift'
    text_phrases:
      - id: gnd_lead_lifted
        words: [GND, lead, lifted]
  - id: panel-c-coulomb-arrow
    kind: horizontal_line
    role: conditional_force_arrow
    y_pdf_cm: 2.38
    x_range_pdf_cm: [9.21, 9.95]
    clearance_pt: 3.0
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-c-coulomb-arrow'
    text_phrases:
      - id: coulomb_label
        words: [Coulomb]
  # The film body itself is a semantic path: at the Coulomb arrow's height the
  # reversed-bend silhouette ran through the label's trailing glyph, and no
  # declared check covered a label against the specimen it annotates.
  - id: panel-c-beam-centerline
    kind: polyline
    role: specimen_body
    # Rendered-PDF samples of the Panel C beam centerline (t = 0, .25, .5,
    # .75, 1 of the authored curve). The clearance covers the drawn half-width
    # (2.35 mm stroke) plus a visible gap, so the gate trips before a glyph
    # reaches the film ink rather than after it overlaps.
    points_pdf_cm:
      - [10.89, 1.37]
      - [10.82, 1.92]
      - [10.63, 2.59]
      - [10.38, 3.25]
      - [10.13, 3.81]
    clearance_pt: 5.5
    defect_kind: label_path_near_miss
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-c-beam-centerline'
    text_phrases:
      - id: coulomb_label_body_clearance
        words: [Coulomb]
  - id: trace-switch-line
    kind: vertical_line
    role: polarity_switch
    x_pdf_cm: 15.23
    y_range_pdf_cm: [1.08, 3.75]
    clearance_pt: 3.0
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-d-trace-switch-line'
    text_phrases:
      - id: reversed_drive
        words: [reversed, drive]
  - id: panel-d-bend-angle-axis
    kind: vertical_line
    role: axis_label_lane
    x_pdf_cm: 13.97
    y_range_pdf_cm: [1.02, 4.08]
    clearance_pt: 2.5
    defect_kind: label_path_near_miss
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-d-bend-angle-axis'
    text_phrases:
      - id: angle_label
        words: [angle]
  # The recovery label previously crowded the terminating time axis, which no
  # declared check covered: the tail polyline below owns the curve, not the axis.
  - id: panel-d-time-axis
    kind: horizontal_line
    role: axis_label_lane
    y_pdf_cm: 2.52
    x_range_pdf_cm: [13.97, 17.37]
    clearance_pt: 2.5
    defect_kind: label_path_near_miss
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-d-time-axis'
    text_phrases:
      - id: recovery_label_axis_clearance
        words: [recovery]
  - id: panel-d-recovery-tail
    kind: polyline
    role: qualitative_response_curve
    points_pdf_cm:
      - [15.71, 1.35]
      - [15.81, 1.17]
      - [16.19, 1.35]
      - [16.57, 1.78]
      - [16.81, 2.04]
      - [17.00, 2.24]
      - [17.19, 2.36]
    clearance_pt: 3.0
    defect_kind: label_curve_near_label
    source_binding:
      source_name: fig5_cantilever_actuation_artifact_v2.tex
      selector: 'figure-agent-path: panel-d-recovery-tail'
    text_phrases:
      - id: recovery_label
        words: [recovery]

# Declared vector-to-vector clearance relations, measured against the authored
# TikZ coordinates. Each entry protects a physical or reading relation that no
# render detector recovers on its own; thresholds sit under the clearance the
# current source already holds so the gate trips on regression, not on the
# authored geometry.
vector_clearance_checks:
  # The +5 kV terminal rail must stay attached to the drive electrode, so the
  # applied bias belongs to the electrode instead of floating in the air-gap
  # annotation lane.
  - id: panelA-bias-rail-touches-drive-electrode
    element_a:
      source_line: 88
      matched_text: '\draw[driveBiasLeader] (3.57,4.34)--(3.57,4.62)'
      kind: line
    element_b:
      source_line: 85
      matched_text: '\draw[apparatus] (3.42,1.40) rectangle (3.72,4.34)'
      kind: rect
    must_touch: true
  # The air-gap dimension arrow measures the gap; its head must stop short of
  # the electrode face or the dimension reads as a line drawn on the plate.
  - id: panelA-gap-dimension-clear-of-drive-electrode
    element_a:
      source_line: 110
      matched_text: '\draw[gapDimension] (2.56,2.02)--(3.33,2.02)'
      kind: line
    element_b:
      source_line: 85
      matched_text: '\draw[apparatus] (3.42,1.40) rectangle (3.72,4.34)'
      kind: rect
    min_clearance_cm: 0.05
  # The lift-direction cue annotates the motion of the lifted GND lead; if it
  # reaches the lead it reads as part of the conductor instead of as a cue.
  - id: panelB-lift-cue-clear-of-lifted-lead
    element_a:
      source_line: 147
      matched_text: '\draw[baselineArrow] (1.56,4.46)--(1.56,4.56)'
      kind: line
    element_b:
      source_line: 145
      matched_text: '\draw[wire] (1.22,4.66)--(1.46,4.58)'
      kind: line
    min_clearance_cm: 0.06
  # The floating-interval rail annotates the plateau; sitting on the response
  # trace would turn an event annotation into a second data segment.
  - id: panelD-floating-rail-clear-of-plateau-trace
    element_a:
      source_line: 296
      matched_text: '\draw[cGray!58!black,line width=0.45pt] (1.66,3.70)--(1.94,3.70)'
      kind: line
    element_b:
      source_line: 274
      kind: line
      bbox_cm: [1.34, 3.58, 1.94, 3.58]
    min_clearance_cm: 0.06
  # The recovery leader owns the rising tail. On the time axis it would read as
  # an axis annotation instead, which is the defect the 2026-08-13 repair fixed.
  - id: panelD-recovery-leader-clear-of-time-axis
    element_a:
      source_line: 305
      matched_text: '\draw[leader] (3.65,2.24)--(3.65,1.62)'
      kind: line
    element_b:
      source_line: 262
      matched_text: '\draw[axis] (0.62,2.52)--(4.02,2.52)'
      kind: line
    min_clearance_cm: 0.15
  # The dashed extrapolated tail approaches the plot's right edge just below the
  # time axis; merging with the axis would erase the unmeasured-tail reading.
  - id: panelD-extrapolated-tail-clear-of-time-axis
    element_a:
      source_line: 282
      matched_text: '(3.84,2.36) .. controls (3.90,2.38) and (3.97,2.41) .. (4.02,2.42)'
      kind: curve
    element_b:
      source_line: 262
      matched_text: '\draw[axis] (0.62,2.52)--(4.02,2.52)'
      kind: line
    min_clearance_cm: 0.05
  # The four relations below terminate on named \coordinate anchors, so they
  # only became measurable once the extractor resolved those names. Against a
  # bezier the detector measures the control hull, not the drawn curve: the
  # two must_touch pairs catch a vector detaching from the member entirely,
  # they cannot see sub-hull drift.
  #
  # Electrostatic attraction is a body force on the film: its tail belongs on
  # the specimen, not floating in the gap beside it.
  - id: panelA-attraction-arrow-starts-on-specimen
    element_a:
      source_line: 116
      matched_text: '\draw[forceToward] (panel-a-attraction-origin)--(panel-a-attraction-head)'
      kind: line
    element_b:
      source_line: 76
      matched_text: 'controls (1.37,3.45) and (1.78,2.25)'
      kind: curve
    must_touch: true
  # The same vector must stop short of the drive electrode: a force arrow that
  # lands on the plate reads as a conductor bridging the air gap.
  - id: panelA-attraction-arrow-clear-of-drive-electrode
    element_a:
      source_line: 116
      matched_text: '\draw[forceToward] (panel-a-attraction-origin)--(panel-a-attraction-head)'
      kind: line
    element_b:
      source_line: 85
      matched_text: '\draw[apparatus] (3.42,1.40) rectangle (3.72,4.34)'
      kind: rect
    min_clearance_cm: 0.50
  # Panel C states the reversed-drive balance: the Coulomb repulsion vector
  # originates at a representative trapped charge carried by the film.
  - id: panelC-coulomb-arrow-starts-on-specimen
    element_a:
      source_line: 241
      matched_text: '\draw[forceAway] (panel-c-force-origin)--(panel-c-coulomb-head)'
      kind: line
    element_b:
      source_line: 208
      matched_text: 'controls (1.43,3.45) and (1.00,2.25)'
      kind: curve
    must_touch: true
  # Panel B is the source-off state, and it only reads as source-off because
  # the GND lead is visibly off the specimen. Closing that gap puts the film
  # back on a grounded conductor, which is the opposite claim.
  - id: panelB-lifted-lead-clear-of-specimen
    element_a:
      source_line: 145
      matched_text: '\draw[wire] (1.22,4.66)--(1.46,4.58)'
      kind: line
    element_b:
      source_line: 149
      matched_text: 'controls (1.69,3.45) and (1.75,2.30)'
      kind: curve
    min_clearance_cm: 0.50

panels:
  - id: A
    caption: Air-gap actuation charge establishes the retained state on the same cantilever
    bbox_pdf_cm: [0.00, 0.00, 4.25, 5.20]
  - id: B
    caption: Source-off ground-lead separation preserves the retained-charge state
    bbox_pdf_cm: [4.25, 0.00, 8.50, 5.20]
  - id: C
    caption: Illustrated conditional force competition after the reversed drive is applied
    bbox_pdf_cm: [8.50, 0.00, 12.75, 5.20]
  - id: D
    caption: Qualitative response trace beginning at actuation onset
    bbox_pdf_cm: [12.75, 0.00, 17.80, 5.20]

notes: |
  A clean compile is not a publication or scientific acceptance claim.
  Representative video frames and the exact protocol/data binding remain human
  gates.

  2026-08-13: accepted as the first-pass figure by the author after a
  four-defect repair round (recovery-label lane, Panel C subtitle redundancy,
  grayscale-safe residual vector, Coulomb label clear of the film body).
  Acceptance is explicitly a first pass; further revision rounds are expected
  and each one re-opens this declaration.
accepted: true
