name: fig5_cantilever_actuation_artifact_v2
paper_binding:
  paper_id: pair001
  figure_id: fig5
  role_id: cantilever_actuation_payoff
title: "Fig 5 artifact — polarity-reversal actuation probe"
style_profile: polymer-paper
undeclared_geometry_profile: schematic
visual_clash_cap: 8
review_scale_previews: required
paper_aesthetic_context: nc-main-text-series
journal_art_direction_playbook: nc-main-text
aesthetic_intent: aesthetic_intent.yaml

# This wide, single-row mechanism figure fits the double-column working width
# without approaching the Nature-family 170 mm height guidance.  Declare its
# real PDF geometry rather than inheriting the source's legacy resize value so
# final-reduction type and line review has a physical placement basis.
final_size_contract:
  basis: width_limited_nature_family_main_figure
  natural_size_mm: [180.8, 53.5]
  target_width_mm: 180.0
  max_height_mm: 170.0
  min_print_font_pt: 5.0
  scale_basis: width_limited
  font_floor_scope: explicit_tex_fontsize_declarations
  double_column_reference_mm:
    nature_communications: 180.0
    nature_figure_guide: 183.0
  note: The 180 mm double-column working target produces a 53.3 mm figure height, well below the 170 mm height guidance; explicit type therefore remains above the 5.0 pt readability floor at placement.

# Require object/relation meaning to be declared before strict physics status
# can be treated as grounded.  This is style-independent and coordinate-free.
semantic_contract_required: true

# Reader-facing stage order that can be verified against the rendered text
# without encoding fixture coordinates.  The source-off state precedes the
# reversed drive, which precedes the observed recovery in the qualitative
# response trace.
semantic_assertions:
  - id: source-off-before-reversed-drive
    relation: left_of
    subject: source-off
    reference: reversed-drive
  - id: reversed-drive-before-recovery
    relation: left_of
    subject: reversed-drive
    reference: recovery

tex_assertions:
  - id: initial-force-points-toward-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceToward
    axis: x
    direction: increasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  - id: illustrated-coulomb-force-points-away-from-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceAway
    axis: x
    direction: decreasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  # Coordinate-bound source geometry: the fixed-end edges must be bisected by
  # the clamp lead so a future redraw cannot silently paste the support off-axis.
  - id: clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-c-beam-origin
    reference_coordinate: panel-c-clamp-axis
    tolerance_cm: 0.02
  - id: actuation-clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-a-beam-origin
    reference_coordinate: panel-a-clamp-axis
    tolerance_cm: 0.02
  - id: isolation-clamp-axis-bisects-cantilever-fixed-end
    kind: path_origin_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    origin_coordinate: panel-b-beam-origin
    reference_coordinate: panel-b-clamp-axis
    tolerance_cm: 0.02

# A declared intermediate stage must have a visible, ordered reader-facing
# anchor. This is a semantic/render contract, not a primitive recipe.
process_stage_visibility_checks:
  - id: isolation-boundary-state
    panel_id: B
    reading_axis: x
    minimum_stage_separation_pt: 12.0
    stages:
      - id: source-off
        text_phrases:
          - id: source-off-heading
            words: [source, 'OFF']
      - id: floating-state
        text_phrases:
          - id: floating-clip
            words: [floating]
  - id: qualitative-response-sequence
    panel_id: D
    reading_axis: x
    minimum_stage_separation_pt: 12.0
    stages:
      - id: observation-origin
        text_phrases:
          - id: actuation-onset-label
            words: [t, "=", "0"]
      - id: source-off-float
        text_phrases:
          - id: source-off-label
            words: ["OFF"]
          - id: floating-label
            words: [floating]
      - id: reversed-drive
        text_phrases:
          - id: reversed-drive-label
            words: [reversed, drive]
      - id: recovery
        text_phrases:
          - id: recovery-label
            words: [recovery]

text_boundary_checks:
  - id: panel-separator-a-b
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 4.46
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-b-c
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 8.92
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-c-d
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 13.38
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-c-coulomb-label-rail
    kind: rect
    role: force_label_rail
    mode: contain_text
    bbox_pdf_cm: [9.05, 2.70, 10.20, 3.00]
    clearance_pt: 0.0
    text_allowlist: [Coulomb]

label_path_proximity_checks:
  - id: manual-sequence-arrow
    kind: horizontal_line
    role: process_arrow
    y_pdf_cm: 2.40
    x_range_pdf_cm: [3.18, 3.98]
    clearance_pt: 3.0
    text_phrases:
      - id: off_float
        words: ['OFF', float]
  - id: panel-c-coulomb-arrow
    kind: horizontal_line
    role: conditional_force_arrow
    y_pdf_cm: 2.38
    x_range_pdf_cm: [9.21, 9.95]
    clearance_pt: 3.0
    text_phrases:
      - id: coulomb_label
        words: [Coulomb]
  - id: trace-switch-line
    kind: vertical_line
    role: polarity_switch
    x_pdf_cm: 15.23
    y_range_pdf_cm: [1.08, 3.75]
    clearance_pt: 3.0
    text_phrases:
      - id: reversed_drive
        words: [reversed, drive]
  - id: panel-d-bend-angle-axis
    kind: vertical_line
    role: axis_label_lane
    x_pdf_cm: 13.97
    y_range_pdf_cm: [1.02, 4.08]
    clearance_pt: 2.5
    defect_kind: label_path_near_miss
    text_phrases:
      - id: bend_angle_label
        words: [bend, angle]
  - id: panel-d-recovery-tail
    kind: polyline
    role: qualitative_response_curve
    points_pdf_cm:
      - [15.71, 1.35]
      - [15.81, 1.17]
      - [16.19, 1.35]
      - [16.57, 1.78]
      - [16.81, 2.04]
      - [17.00, 2.24]
      - [17.19, 2.36]
    clearance_pt: 3.0
    defect_kind: label_curve_near_label
    text_phrases:
      - id: recovery_label
        words: [recovery]

panels:
  - id: A
    caption: Air-gap actuation charge establishes the retained state on the same cantilever
    bbox_pdf_cm: [0.00, 0.00, 4.25, 5.20]
  - id: B
    caption: Source-off ground-lead separation preserves the retained-charge state
    bbox_pdf_cm: [4.25, 0.00, 8.50, 5.20]
  - id: C
    caption: Illustrated conditional force competition after the reversed drive is applied
    bbox_pdf_cm: [8.50, 0.00, 12.75, 5.20]
  - id: D
    caption: Qualitative response trace beginning at actuation onset
    bbox_pdf_cm: [12.75, 0.00, 17.80, 5.20]

notes: |
  Exploratory story artifact only. A clean compile is not a publication or
  scientific acceptance claim. Representative video frames and the exact
  protocol/data binding remain human gates.
