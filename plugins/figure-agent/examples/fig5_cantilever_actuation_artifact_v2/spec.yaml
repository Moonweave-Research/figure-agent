name: fig5_cantilever_actuation_artifact_v2
title: "Fig 5 artifact — polarity-reversal actuation probe"
style_profile: polymer-paper
undeclared_geometry_profile: schematic
visual_clash_cap: 8

# Require object/relation meaning to be declared before strict physics status
# can be treated as grounded.  This is style-independent and coordinate-free.
semantic_contract_required: true

tex_assertions:
  - id: initial-force-points-toward-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceToward
    axis: x
    direction: increasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  - id: illustrated-coulomb-force-points-away-from-drive
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    anchor_style: forceAway
    axis: x
    direction: decreasing
    minimum_matches: 1
    require_unidirectional_arrow: true
  # Coordinate-bound source geometry: the fixed-end edges must be bisected by
  # the clamp lead so a future redraw cannot silently paste the support off-axis.
  - id: clamp-axis-bisects-cantilever-fixed-end
    kind: centerline_aligned
    source_name: fig5_cantilever_actuation_artifact_v2.tex
    axis: x
    edge_coordinates: [panel-c-cantilever-left, panel-c-cantilever-right]
    reference_coordinate: panel-c-clamp-axis
    tolerance_cm: 0.02

# A declared intermediate stage must have a visible, ordered reader-facing
# anchor. This is a semantic/render contract, not a primitive recipe.
process_stage_visibility_checks:
  - id: isolation-boundary-state
    panel_id: B
    reading_axis: y
    minimum_stage_separation_pt: 12.0
    stages:
      - id: source-off
        text_phrases:
          - id: source-off-heading
            words: [source, 'OFF']
      - id: clip-open
        text_phrases:
          - id: ground-open
            words: [GND, open]
  - id: qualitative-response-sequence
    panel_id: D
    reading_axis: x
    minimum_stage_separation_pt: 12.0
    stages:
      - id: observation-origin
        text_phrases:
          - id: actuation-onset-label
            words: [t, "=", "0"]
          - id: off-label
            words: ["OFF"]
      - id: reversed-drive
        text_phrases:
          - id: reversed-drive-label
            words: [reversed, drive]
      - id: recovery
        text_phrases:
          - id: recovery-label
            words: [recovery]

text_boundary_checks:
  - id: panel-separator-a-b
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 4.46
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-b-c
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 8.92
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-separator-c-d
    kind: vertical_line
    role: panel_separator
    x_pdf_cm: 13.38
    y_range_pdf_cm: [0.55, 4.78]
    clearance_pt: 0.5
  - id: panel-c-coulomb-label-rail
    kind: rect
    role: force_label_rail
    mode: contain_text
    bbox_pdf_cm: [9.05, 2.70, 10.00, 3.00]
    clearance_pt: 0.0
    text_allowlist: [Coulomb]

label_path_proximity_checks:
  - id: manual-sequence-arrow
    kind: horizontal_line
    role: process_arrow
    y_pdf_cm: 2.40
    x_range_pdf_cm: [3.18, 3.98]
    clearance_pt: 3.0
    text_phrases:
      - id: off_float
        words: ['OFF', float]
  - id: panel-c-coulomb-arrow
    kind: horizontal_line
    role: conditional_force_arrow
    y_pdf_cm: 2.38
    x_range_pdf_cm: [9.21, 9.95]
    clearance_pt: 3.0
    text_phrases:
      - id: coulomb_label
        words: [Coulomb]
  - id: trace-switch-line
    kind: vertical_line
    role: polarity_switch
    x_pdf_cm: 15.23
    y_range_pdf_cm: [1.08, 3.75]
    clearance_pt: 3.0
    text_phrases:
      - id: reversed_drive
        words: [reversed, drive]

panels:
  - id: A
    caption: Air-gap actuation charge establishes the retained state on the same cantilever
    bbox_pdf_cm: [0.00, 0.00, 4.25, 5.20]
  - id: B
    caption: Source-off clip-open isolation preserves the retained-charge state
    bbox_pdf_cm: [4.25, 0.00, 8.50, 5.20]
  - id: C
    caption: Illustrated conditional force competition after the reversed drive is applied
    bbox_pdf_cm: [8.50, 0.00, 12.75, 5.20]
  - id: D
    caption: Qualitative response trace beginning at actuation onset
    bbox_pdf_cm: [12.75, 0.00, 17.80, 5.20]

notes: |
  Exploratory story artifact only. A clean compile is not a publication or
  scientific acceptance claim. Representative video frames and the exact
  protocol/data binding remain human gates.
