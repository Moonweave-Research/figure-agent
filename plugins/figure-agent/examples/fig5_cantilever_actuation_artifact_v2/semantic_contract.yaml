schema: figure-agent.failure-first-semantic-contract.v1
selector_id: fig5.actuation_mechanism

# This contract records meaning, not drawing style or coordinates.  It is the
# transfer rule learned from the first Fig5 artifact: "charge" is an
# electromechanical state in the air-gap actuation geometry, not a generic HV
# charging station.
required_objects:
  - panel_a.cantilever
  - panel_a.drive_electrode
  - panel_a.clip_ground
  - panel_a.air_gap
  - panel_a.actuation_charge_state
  - panel_a.trapped_charge
  - panel_a.attraction_force
  - panel_b.isolation_state
  - panel_b.trapped_charge
  - panel_b.manual_lead_separation
  - panel_b.floating_state
  - panel_b.residual_attraction
  - panel_d.positive_plateau
  - panel_c.trapped_charge
  - panel_c.maxwell_baseline
  - panel_c.coulomb_force
  - panel_c.reverse_drive
  - panel_c.conditional_reverse_bend
  - panel_d.time_origin
  - panel_d.response_trace
  - panel_d.polarity_switch

forbidden_implications:
  - panel_a.standalone_two_terminal_charger
  - panel_b.automated_switch
  - panel_a.polarization_measurement_instrument
  - panel_a.esvm_measurement_head
  - panel_a.corona_needle
  - panel_a.charging_grid
  - panel_a.sample_outside_actuation_geometry
  - panel_b.grounded_support_boundary_after_isolation
  - panel_d.quantitative_measured_waveform

protected_relations:
  - cantilever_faces_drive_electrode_across_air_gap
  - charge_phase_is_actuation_state
  - attraction_acts_during_charge
  - trap_label_leader_clears_glyphs
  - air_gap_coupling_is_capacitor_like_schematic_only
  - source_off_isolation_precedes_drive_polarity_reversal
  - trapped_charge_remains_on_same_specimen_after_isolation
  - representative_charge_markers_remain_inside_film
  - force_vector_origins_touch_declared_body
  - residual_attraction_vector_is_shorter_than_drive_on_attraction
  - same_mounted_film_scale_across_panels
  - coulomb_term_changes_sign_with_drive_polarity
  - maxwell_baseline_is_polarity_independent
  - conditional_reverse_bend_is_not_observed_snapshot
  - conditional_reverse_bend_owns_force_hierarchy
  - clamp_axis_aligns_with_cantilever_centerline
  - response_trace_is_qualitative_not_calibrated_data
  - positive_plateau_is_explicit
  - reverse_response_is_faster_than_initial_attraction
  - source_off_floating_interval_is_explicit
  - lead_separation_is_manual
  - cantilever_remains_clamped_after_manual_lead_lift
  - panel_b_floats_after_source_off
  - residual_attraction_bend_persists_after_source_off
  - conditional_coulomb_force_originates_at_trapped_charge
  - cantilever_free_end_follows_local_tangent

repair:
  family: actuation_geometry_and_mechanism_contract
  selector_id: fig5.actuation_mechanism
  max_source_blocks: 1

semantic_legibility:
  object_roles:
    - object_id: panel_a.cantilever
      declared_role: polymer_cantilever
      forbidden_readings: [horizontal_test_strip, floating_sample_block]
    - object_id: panel_a.drive_electrode
      declared_role: active_actuation_electrode
      forbidden_readings: [measurement_probe, polarization_meter_head]
    - object_id: panel_a.clip_ground
      declared_role: charging_phase_ground_reference_at_clip
      forbidden_readings: [high_voltage_terminal, driven_electrode]
    - object_id: panel_a.air_gap
      declared_role: noncontact_air_gap
      forbidden_readings: [electrical_wire, solid_contact]
    - object_id: panel_a.actuation_charge_state
      declared_role: electromechanical_charge_phase
      forbidden_readings: [standalone_hv_charger, polarization_measurement]
    - object_id: panel_a.trapped_charge
      declared_role: representative_trapped_charge_marker
      forbidden_readings: [decorative_bead, detached_annotation]
    - object_id: panel_a.attraction_force
      declared_role: charge_phase_attraction
      forbidden_readings: [decorative_arrow]
    - object_id: panel_b.isolation_state
      declared_role: isolation_transition
      forbidden_readings: [automated_motion_stage, conveyor_transfer]
    - object_id: panel_b.trapped_charge
      declared_role: retained_trapped_charge
      forbidden_readings: [decorative_bead]
    - object_id: panel_b.manual_lead_separation
      declared_role: manual_lead_lift_to_floating_state
      forbidden_readings: [automated_switch, automated_motion_stage]
    - object_id: panel_b.floating_state
      declared_role: source_off_electrically_floating_mounted_film
      forbidden_readings: [grounded_support_boundary, automated_switch]
    - object_id: panel_b.residual_attraction
      declared_role: retained_charge_residual_attraction_bend
      forbidden_readings: [drive_on_force, unbent_isolation_state]
    - object_id: panel_c.trapped_charge
      declared_role: representative_trapped_charge_marker
      forbidden_readings: [decorative_bead, detached_force_origin]
    - object_id: panel_c.coulomb_force
      declared_role: polarity_dependent_force
      forbidden_readings: [annotation_leader]
    - object_id: panel_c.maxwell_baseline
      declared_role: polarity_independent_attraction
      forbidden_readings: [decorative_baseline, second_coulomb_force]
    - object_id: panel_c.reverse_drive
      declared_role: polarity_reversal_perturbation
      forbidden_readings: [observed_force_vector]
    - object_id: panel_c.conditional_reverse_bend
      declared_role: conditional_reverse_bend_response
      forbidden_readings: [independent_second_sample, observed_comparison]
    - object_id: panel_d.response_trace
      declared_role: qualitative_bend_trace
      forbidden_readings: [calibrated_current_waveform]
    - object_id: panel_d.positive_plateau
      declared_role: sustained_positive_bend_state
      forbidden_readings: [rounded_hump_without_hold, twenty_minute_time_ratio]
    - object_id: panel_d.time_origin
      declared_role: actuation_onset_time_origin
      forbidden_readings: [missing_time_origin, twenty_minute_trace_plateau]
    - object_id: panel_d.polarity_switch
      declared_role: drive_polarity_reversal
      forbidden_readings: [time_axis_break]
  visible_connectors:
    - connector_id: panel_a.air_gap_separates_members
      from_object: panel_a.cantilever
      to_object: panel_a.drive_electrode
      declared_role: separation_by_air_gap
      render_style: separation_dimension
    - connector_id: panel_a.attraction_belongs_to_charge_phase
      from_object: panel_a.actuation_charge_state
      to_object: panel_a.attraction_force
      declared_role: force_direction
      render_style: force_directional
      epistemic_status: derived
    - connector_id: panel_a.charge_enters_isolation
      from_object: panel_a.actuation_charge_state
      to_object: panel_b.isolation_state
      declared_role: process_stage_transition
      render_style: stage_transition
    - connector_id: panel_b.isolation_retains_charge
      from_object: panel_b.trapped_charge
      to_object: panel_b.isolation_state
      declared_role: process_stage_transition
      render_style: stage_transition
    - connector_id: panel_b.floating_state_retains_residual_attraction
      from_object: panel_b.floating_state
      to_object: panel_b.residual_attraction
      declared_role: source_off_residual_force_state
      render_style: force_residual
      epistemic_status: observed
    - connector_id: panel_b.isolation_enables_reversed_force
      from_object: panel_b.isolation_state
      to_object: panel_c.coulomb_force
      declared_role: force_direction
      render_style: force_conditional
      epistemic_status: conditional
      condition: Illustrated reversed-polarity condition; the charge-mediated term opposes the Maxwell baseline.
    - connector_id: panel_c.coulomb_originates_at_trapped_charge
      from_object: panel_c.trapped_charge
      to_object: panel_c.coulomb_force
      declared_role: conditional_force_origin
      render_style: force_conditional
      epistemic_status: conditional
      condition: A representative trapped charge anchors the illustrated charge-mediated force term.
    - connector_id: panel_c.maxwell_baseline_is_separate_term
      from_object: panel_c.maxwell_baseline
      to_object: panel_c.coulomb_force
      declared_role: force_decomposition
      render_style: force_directional
    - connector_id: panel_d.switch_owns_bend_reversal
      from_object: panel_c.reverse_drive
      to_object: panel_d.response_trace
      declared_role: process_stage_transition
      render_style: stage_transition
  forbidden_connectors:
    - from_object: panel_a.cantilever
      to_object: panel_a.drive_electrode
      declared_role: electrical_contact
    - from_object: panel_a.drive_electrode
      to_object: panel_a.cantilever
      declared_role: sample_measurement_lead
    - from_object: panel_a.actuation_charge_state
      to_object: panel_a.drive_electrode
      declared_role: measurement_acquisition
  label_ownership:
    - label_id: panel_a.air_gap_label
      owner: panel_a.air_gap
    - label_id: panel_a.charge_phase_label
      owner: panel_a.actuation_charge_state
    - label_id: panel_a.trapped_charge_label
      owner: panel_a.trapped_charge
    - label_id: panel_a.drive_bias_label
      owner: panel_a.drive_electrode
    - label_id: panel_a.clip_ground_label
      owner: panel_a.clip_ground
    - label_id: panel_a.attraction_label
      owner: panel_a.attraction_force
    - label_id: panel_b.isolation_label
      owner: panel_b.isolation_state
    - label_id: panel_b.manual_lead_label
      owner: panel_b.manual_lead_separation
    - label_id: panel_b.floating_state_label
      owner: panel_b.floating_state
    - label_id: panel_b.residual_attraction_label
      owner: panel_b.residual_attraction
    - label_id: panel_c.trapped_charge_label
      owner: panel_c.trapped_charge
    - label_id: panel_c.coulomb_label
      owner: panel_c.coulomb_force
    - label_id: panel_c.maxwell_label
      owner: panel_c.maxwell_baseline
    - label_id: panel_c.reverse_drive_label
      owner: panel_c.reverse_drive
    - label_id: panel_d.polarity_label
      owner: panel_d.polarity_switch
    - label_id: panel_d.time_origin_label
      owner: panel_d.time_origin
    - label_id: panel_d.trace_label
      owner: panel_d.response_trace
  panel_story:
    reading_order: [A, B, C, D]
    panels:
      - panel_id: A
        role: setup
        reader_task: Establish air-gap actuation while retained charge is formed.
      - panel_id: B
        role: workflow
        reader_task: Show the electrically floating source-off state and its residual attraction bend.
      - panel_id: C
        role: mechanism
        reader_task: Separate the conditional charge-mediated term from the Maxwell baseline after reversal.
      - panel_id: D
        role: result
        reader_task: Show the qualitative time ordering from the observation origin through reversal and recovery.
    causal_sequence:
      stages:
        - panel_id: A
          stage: preparation
        - panel_id: B
          stage: isolation
        - panel_id: C
          stage: perturbation
        - panel_id: D
          stage: response

publication_acceptance: not_claimed
