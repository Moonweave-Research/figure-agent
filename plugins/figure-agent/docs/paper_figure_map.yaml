schema: figure-agent.paper-figure-map.v2
paper_id: pair001
plan_doc: docs/superpowers/specs/2026-06-22-sulfur-paper-figure-plan-design.md
authority_scope: figure_agent_candidate_bindings
paper_artifact_registry:
  system: researchos
  registry: docs/figure_set/FIGURE_REGISTRY.yaml
  owner: 02_Surfur_Polymer canonical project root
  scope: Exact paper artifact identity, lifecycle, source/build provenance, and human gate.

# This map is the machine-readable source of truth for Figure Agent fixture-to-
# paper-role bindings. It does not own the paper artifact itself: a fixture is a
# development candidate until the external ResearchOS registry promotes a
# separately declared paper artifact.
#
# The active fixtures remain direct `examples/<fixture>` roots. Their location
# is a reproducibility contract, not a lifecycle label: historical fixtures are
# classified below, and Fig1's nested repair is resolved only through its
# current-candidate pointer.
current_schematic_baseline:
  id: pair001-main-schematics
  aesthetic_context: nc-main-text-series
  fixtures:
    - fig1_updated_agent_redraw_v1
    - fig2_charge_transport_mechanism
    - fig5_cantilever_actuation_artifact_v2

figures:
  fig1:
    figure_id: fig1
    role_id: overview_structure_charge_trapping
    status: active_candidate
    fixture: fig1_updated_agent_redraw_v1
    source_pointer: review/current-candidate.json
    fixture_scope: full_figure_candidate
    assembly_state: human_selection_pending
  fig2:
    figure_id: fig2
    role_id: charge_transport_mechanism_schematic
    status: active_candidate
    fixture: fig2_charge_transport_mechanism
    fixture_scope: panel_a_schematic_candidate
    assembly_state: external_full_figure_ready
  fig3:
    figure_id: fig3
    role_id: frequency_domain_dielectric_response
    status: planned_missing
    slot_status: fixed
    evidence_status: external_canonical_artifact_ready
    authoring_scope: external_quantitative_data
    assembly_state: external_full_figure_ready
  fig4:
    figure_id: fig4
    role_id: trap_energy_distribution
    status: planned_missing
    slot_status: fixed
    evidence_status: run_validated_aggregate_pipeline_pending
    authoring_scope: external_quantitative_data_with_optional_schematic
    assembly_state: external_full_figure_pending
  fig5:
    figure_id: fig5
    role_id: cantilever_actuation_payoff
    status: active_candidate
    fixture: fig5_cantilever_actuation_artifact_v2
    fixture_scope: mechanism_schematic_candidate
    assembly_state: external_full_figure_pending

# Every tracked real fixture belongs to exactly one main-figure binding above or
# one explicit non-main class below. Non-main entries remain usable evidence;
# their presence is advisory and never makes strict plan validation fail.
