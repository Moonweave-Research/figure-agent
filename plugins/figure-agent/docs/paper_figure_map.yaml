# These directories are historical experiment/evidence collections rather than
# runnable Figure Agent fixtures, so inventing a minimal spec would misrepresent
# their contract. Every non-underscore examples directory without spec.yaml must
# appear here with a bounded scope and rationale or plan-check fails.
non_fixture_artifacts:
  - directory: fig1_direct_svg_cleanroom_baseline
    classification: experiment_evidence
    scope: Fig1 direct-SVG cleanroom packets, contracts, reference crop, and review state
    rationale: This directory records a backend experiment and has no fixture source or compile contract.
  - directory: fig1_panel_f_svg_backend_pilot
    classification: artifact_collection
    scope: Fig1 Panel F SVG/TikZ comparison renders, motif source, receipt, and human review
    rationale: This directory is a historical paired-render artifact collection, not an executable fixture.
