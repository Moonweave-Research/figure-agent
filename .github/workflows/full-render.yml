name: figure-agent full render tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-render:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-render')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: plugins/figure-agent
    env:
      PYTHONPATH: ${{ github.workspace }}/plugins/figure-agent/scripts:${{ github.workspace }}/plugins/figure-agent/scripts/checks
    steps:
      - uses: actions/checkout@v5
        with:
          # History-pinned render tests replay recorded commits; a shallow
          # clone fails them with CalledProcessError before any figure is judged.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: full-render

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        timeout-minutes: 12
        run: |
          sudo apt-get update
          # Pre-accept the Microsoft Core Fonts EULA so the installer is non-interactive.
          # Required for polymer-paper-preamble.sty's `\setmainfont{Arial}` lookup.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            dvisvgm \
            imagemagick \
            librsvg2-bin \
            poppler-utils \
            qpdf \
            tesseract-ocr \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-luatex \
            texlive-pictures \
            ttf-mscorefonts-installer
          # Refresh the font cache so fontspec/lualatex can find Arial by name.
          sudo fc-cache -f

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Compile fixtures and check visual clash budgets
        timeout-minutes: 30
        run: |
          # The loop runs under `bash -e`: without collecting failures, the
          # first broken fixture aborts it and every later fixture plus the
          # clash-budget check go unrun while the job still reports one cause.
          rc=0
          failed=()
          for spec in examples/*/spec.yaml; do
            fixture="$(dirname "$spec")"
            name="$(basename "$fixture")"
            tex="$fixture/$name.tex"
            if [[ -f "$tex" ]]; then
              bash scripts/compile.sh "$tex" || { rc=1; failed+=("$name"); }
            fi
          done
          uv run python3 scripts/checks/check_visual_clash_budget.py examples || rc=1
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "compile failures: ${failed[*]}"
          fi
          exit $rc

      # One unrelated fixture failing its compile contract used to end the job
      # here, so the render-marked tests below never ran on main. Both signals
      # are wanted and neither should mask the other; the job still fails if
      # any step fails.
      - name: Pre-build smoke export (required by stage-assertion test)
        if: ${{ !cancelled() }}
        run: |
          uv run python3 scripts/run_export.py smoke_trap_demo

      - name: Run tests
        if: ${{ !cancelled() }}
        # local_render_signature tests pin pdftotext output recorded on the
        # authoring machine; Ubuntu TeX/poppler extract different text, so they
        # are excluded here by name rather than left to fail on platform drift.
        run: uv run pytest -q -m "not local_render_signature"
